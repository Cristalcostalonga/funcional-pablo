<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Funcional | Pablo Costtalonga</title>
<style>
:root{--bg:#090909;--panel:#141414;--line:#2b2b2b;--text:#f5f5f5;--muted:#a3a3a3;--orange:#f97316;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;font-weight:750;background:var(--orange);color:#111}button.secondary{background:#242424;color:#eee;border:1px solid #393939}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;background:#0d0d0d;color:#fff;border:1px solid #363636;border-radius:10px;padding:12px}label{display:block;font-size:.82rem;color:#c7c7c7;font-weight:700;margin:12px 0 6px}.shell{max-width:1100px;margin:auto;padding:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.bolt{background:var(--orange);color:#111;border-radius:13px;padding:8px 13px;font-size:1.4rem}.muted{color:var(--muted)}.small{font-size:.88rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}.narrow{max-width:560px;margin:42px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#2a1a0c;color:#fed7aa;margin:12px 0}.ok{background:#102518;color:#bbf7d0}.err{background:#351313;color:#fecaca}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#292929;border:2px solid var(--orange)}h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.12;margin:.4em 0}h2{margin-top:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav button{background:#242424;color:#eee}nav button.active{background:var(--orange);color:#111}.slot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.slot:last-child{border-bottom:0}.footer{padding:22px 0;color:#777;font-size:.8rem}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.days button{padding:12px 4px;font-size:.85rem}.days button.selected{background:var(--orange);color:#111}.days button:not(.selected){background:#292929;color:#eee}.logo{height:54px;max-width:150px;object-fit:contain}.mini{font-size:.78rem}.exercise-row{padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}@media(max-width:600px){.days{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{padding:12px}.card{padding:16px}}
</style>
</head><body><div class="shell"><header class="row space"><div class="brand"><span class="bolt" id="brandSymbol">⚡</span><img id="brandLogo" class="logo hidden" alt="Logo"><span id="brandText">Funcional<br><span class="muted small">Pablo Costtalonga</span></span></div><div id="headerActions" class="row"></div></header><main id="app"><div class="card narrow"><h1>Seu treino. Sua evolução.</h1><p class="muted">Carregando o sistema…</p></div></main><footer class="footer">Seus dados são vinculados à sua conta. Use “Sair” em dispositivos compartilhados.</footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<script>
(()=>{'use strict';
const app=document.querySelector('#app'), actions=document.querySelector('#headerActions');let sb=null,user=null,profile=null,tab='inicio',weekOffset=0,selectedDay=0,siteSettings={name:'Funcional Pablo Costtalonga',primary_color:'#f97316',logo_url:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(text,kind='notice')=>`<div class="notice ${kind}">${esc(text)}</div>`;
const ready=()=>window.FUNCIONAL_CONFIG&&FUNCIONAL_CONFIG.SUPABASE_URL.startsWith('https://')&&!FUNCIONAL_CONFIG.SUPABASE_ANON_KEY.includes('COLE_AQUI');
async function loadSettings(){const {data,error}=await sb.from('app_settings').select('name,primary_color,logo_url').eq('id',1).maybeSingle();if(!error&&data)siteSettings={...siteSettings,...data};document.documentElement.style.setProperty('--orange',/^#[0-9a-fA-F]{6}$/.test(siteSettings.primary_color)?siteSettings.primary_color:'#f97316');document.querySelector('#brandText').textContent=siteSettings.name;const logo=document.querySelector('#brandLogo'),symbol=document.querySelector('#brandSymbol');if(siteSettings.logo_url){logo.src=siteSettings.logo_url;logo.classList.remove('hidden');symbol.classList.add('hidden')}else{logo.classList.add('hidden');symbol.classList.remove('hidden')}}
function init(){if(!window.supabase){app.innerHTML=`<div class="card">Não foi possível carregar a biblioteca de autenticação. Verifique sua conexão e recarregue a página.</div>`;return}if(!ready()){app.innerHTML=`<section class="card narrow"><h1>Configuração necessária</h1><p>O site está pronto para conectar, mas ainda precisa dos dados públicos do projeto Supabase.</p><ol><li>Crie um projeto no Supabase.</li><li>Abra <b>Project Settings → API</b>.</li><li>Copie a Project URL e a chave pública anon/publishable para o arquivo <code>config.js</code>.</li><li>Execute o arquivo <code>supabase/schema.sql</code> no SQL Editor.</li></ol><p class="muted">Não coloque aqui uma chave service_role ou qualquer segredo administrativo.</p></section>`;return}sb=window.supabase.createClient(FUNCIONAL_CONFIG.SUPABASE_URL,FUNCIONAL_CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});loadSettings();sb.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(load,0)});sb.auth.getSession().then(({data})=>{user=data.session?.user||null;load()})}
async function load(){if(user)await loadSettings();if(!user){profile=null;actions.innerHTML='';renderAuth();return}const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error){app.innerHTML=`<section class="card">${msg('Não foi possível carregar seu perfil: '+error.message,'err')}<button onclick="location.reload()">Tentar novamente</button></section>`;return}profile=data;actions.innerHTML=`<span class="muted small">${esc(profile?.full_name||user.email)}</span> <button class="secondary" id="logout">Sair</button>`;document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut()};if(!profile||!profile.full_name||!profile.age||!profile.photo_path){renderProfile(true);return}renderHome()}
function renderAuth(error=''){app.innerHTML=`<section class="card narrow"><p class="muted">ÁREA DO ALUNO E DO PROFESSOR</p><h1>Acesse sua conta</h1><p class="muted">Entre uma vez e sua sessão será mantida neste navegador. Seus dados pessoais não precisam ser preenchidos novamente a cada acesso.</p>${error?msg(error,'err'):''}<form id="login"><label>E-mail</label><input name="email" type="email" autocomplete="email" required><label>Senha</label><input name="password" type="password" autocomplete="current-password" minlength="8" required><p class="small muted">Ainda não tem conta? Preencha os campos e escolha “Criar conta”.</p><div class="row"><button type="submit">Entrar</button><button type="button" class="secondary" id="signup">Criar conta de aluno</button></div></form><p class="small muted">O cadastro público cria contas de aluno. O perfil de professor precisa ser autorizado pelo administrador para proteger a área de gestão.</p></section>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)renderAuth(error.message)};document.querySelector('#signup').onclick=async()=>{const f=new FormData(document.querySelector('#login'));const email=f.get('email'),password=f.get('password');if(!email||!password||password.length<8){renderAuth('Informe e-mail e senha com pelo menos 8 caracteres para criar a conta.');return}const {error}=await sb.auth.signUp({email,password});if(error)renderAuth(error.message);else app.innerHTML=`<section class="card narrow">${msg('Conta criada. Se a confirmação por e-mail estiver habilitada no Supabase, confirme seu endereço e depois entre.','ok')}<button onclick="location.reload()">Voltar ao login</button></section>`}}
function renderProfile(first=false){const isTeacher=profile?.role==='teacher';app.innerHTML=`<section class="card narrow"><h1>${first?'Complete seu cadastro':'Meu perfil'}</h1><p class="muted">${first?'Preencha estas informações apenas no primeiro acesso. Depois, elas ficam salvas na sua conta.':'Atualize seus dados. Sua conta continuará vinculada ao mesmo perfil.'}</p><form id="profileForm"><label>Nome completo</label><input name="full_name" autocomplete="name" value="${esc(profile?.full_name||'')}" required maxlength="100"><label>Idade</label><input name="age" type="number" min="1" max="120" step="1" value="${esc(profile?.age||'')}" required><label>WhatsApp com DDD</label><input name="whatsapp" type="tel" autocomplete="tel" placeholder="Ex.: 5521999999999" value="${esc(profile?.whatsapp||'')}" required><label>Foto de perfil ${profile?.photo_path?'(já cadastrada; envie outra se quiser trocar)':'(obrigatória)'}</label><input name="photo" type="file" accept="image/png,image/jpeg,image/webp" ${profile?.photo_path?'':'required'}><label>Perfil</label><input value="${isTeacher?'Professor':'Aluno/Atleta'}" disabled><p class="small muted">Aceitamos imagens JPG, PNG ou WebP de até 5 MB. A foto é armazenada no espaço privado do sistema.</p><button type="submit">Salvar perfil</button> <button type="button" class="secondary" id="cancelEdit">Voltar</button></form><div id="formMessage"></div></section>`;document.querySelector('#cancelEdit').onclick=()=>{if(profile?.full_name&&profile?.photo_path)renderHome()};document.querySelector('#profileForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,fd=new FormData(form),name=String(fd.get('full_name')).trim(),age=Number(fd.get('age')),whatsapp=String(fd.get('whatsapp')).trim(),file=fd.get('photo');const out=document.querySelector('#formMessage');if(!name||!Number.isInteger(age)||age<1||age>120||!whatsapp){out.innerHTML=msg('Confira nome, idade e WhatsApp.','err');return}let photoPath=profile?.photo_path||null;if(file&&file.size){if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>5*1024*1024){out.innerHTML=msg('A foto precisa ser JPG, PNG ou WebP de até 5 MB.','err');return}const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';photoPath=`${user.id}/avatar.${ext}`;const {error:uploadErr}=await sb.storage.from('profile-photos').upload(photoPath,file,{upsert:true,contentType:file.type});if(uploadErr){out.innerHTML=msg('Erro ao enviar foto: '+uploadErr.message,'err');return}}if(!photoPath){out.innerHTML=msg('Envie uma foto de perfil para continuar.','err');return}const patch={id:user.id,full_name:name,age,whatsapp,photo_path:photoPath,updated_at:new Date().toISOString()};const {id,updated_at,...allowed}=patch;const {error}=profile?await sb.from('profiles').update(allowed).eq('id',user.id):await sb.from('profiles').insert({...allowed,id:user.id,role:'student'});if(error){out.innerHTML=msg('Não foi possível salvar: '+error.message,'err');return}await load()}}
async function photoUrl(path){if(!path)return null;const {data}=await sb.storage.from('profile-photos').createSignedUrl(path,1800);return data?.signedUrl||null}
async function renderHome(){const isTeacher=profile.role==='teacher';const purl=await photoUrl(profile.photo_path);if(!isTeacher&&['alunos','biblioteca','personalizar'].includes(tab))tab='inicio';app.innerHTML=`<section class="card"><div class="row"><img class="avatar" id="avatar" alt="Foto de perfil"><div><p class="muted small">${isTeacher?'PAINEL DO PROFESSOR':'ÁREA DO ALUNO'}</p><h1>Olá, ${esc(profile.full_name.split(' ')[0])}!</h1><p class="muted">${esc(siteSettings.name)}</p></div></div></section><nav>${(isTeacher?[['inicio','Visão geral'],['perfil','Meu perfil'],['alunos','Alunos'],['agenda','Agenda'],['biblioteca','Biblioteca'],['treinos','Treinos'],['diario','Diário'],['personalizar','Personalizar']]:[['inicio','Início'],['perfil','Meu perfil'],['agenda','Agendar horário'],['treinos','Meu treino'],['diario','Meu diário']]).map(([id,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</nav><div id="panel"></div>`;if(purl)document.querySelector('#avatar').src=purl;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderHome()});const panel=document.querySelector('#panel');if(tab==='perfil'){panel.innerHTML=`<section class="card"><div class="row"><img class="avatar" src="${purl||''}" alt="Foto"><div><h2>${esc(profile.full_name)}</h2><p class="muted">${profile.age} anos · ${esc(profile.whatsapp)}</p></div></div><button id="editProfile">Editar meu perfil</button></section>`;panel.querySelector('#editProfile').onclick=()=>renderProfile(false)}else if(tab==='agenda')await renderSchedule(panel,isTeacher);else if(tab==='alunos'&&isTeacher)await renderStudents(panel);else if(tab==='biblioteca'&&isTeacher)await renderLibrary(panel);else if(tab==='treinos')await renderWorkouts(panel,isTeacher);else if(tab==='diario')await renderDiary(panel,isTeacher);else if(tab==='personalizar'&&isTeacher)await renderCustomize(panel);else{panel.innerHTML=`<div class="grid"><section class="card"><h2>Meu perfil</h2><p class="muted">Seus dados ficam salvos na conta.</p><button class="secondary" id="goProfile">Ver perfil</button></section><section class="card"><h2>Agenda</h2><p class="muted">Consulte horários e reservas.</p><button id="goSchedule">Abrir agenda</button></section><section class="card"><h2>Treinos</h2><p class="muted">${isTeacher?'Monte planos para os alunos.':'Consulte o plano atribuído pelo professor.'}</p><button id="goWorkouts">Ver treinos</button></section></div>`;panel.querySelector('#goProfile').onclick=()=>{tab='perfil';renderHome()};panel.querySelector('#goSchedule').onclick=()=>{tab='agenda';renderHome()};panel.querySelector('#goWorkouts').onclick=()=>{tab='treinos';renderHome()}}}
async function renderStudents(panel){const {data,error}=await sb.from('profiles').select('id,full_name,age,whatsapp,role').eq('role','student').order('full_name');panel.innerHTML=`<section class="card"><h2>Alunos cadastrados</h2>${error?msg(error.message,'err'):(data||[]).map(s=>`<div class="slot"><div><b>${esc(s.full_name)}</b><div class="muted small">${s.age||'—'} anos · ${esc(s.whatsapp||'—')}</div></div><button class="secondary" data-student="${s.id}">Montar treino</button></div>`).join('')||'<p class="muted">Nenhum aluno cadastrado.</p>'}</section>`;panel.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{selectedStudent=b.dataset.student;tab='treinos';renderHome()})}
let selectedStudent=null;
async function renderLibrary(panel){
 panel.innerHTML=`<section class="card"><div class="row space"><div><h2>Biblioteca de exercícios</h2><p class="muted">Pesquise e cadastre exercícios para reutilizar nos treinos.</p></div><button id="newExercise">+ Novo exercício</button></div><div class="grid"><div><label>Buscar pelo nome</label><input id="exSearch" placeholder="Ex.: agachamento"></div><div><label>Grupo muscular</label><input id="exMuscle" placeholder="Ex.: pernas"></div><div><label>Equipamento</label><input id="exEquipment" placeholder="Ex.: halter"></div><div><label>Ambiente</label><select id="exEnvironment"><option value="">Todos</option><option value="academia">Academia</option><option value="estudio">Estúdio</option><option value="casa">Casa</option></select></div></div><div id="libraryMessage"></div><div id="libraryResults"><p class="muted">Carregando exercícios…</p></div></section><div id="libraryEditor"></div>`;
 let exercises=[];
 const message=(t,k='notice')=>{const node=panel.querySelector('#libraryMessage');if(node)node.innerHTML=msg(t,k)};
 const read=async()=>{const {data,error}=await sb.from('exercise_library').select('id,name,description,muscle_groups,equipment,environments,instructions,media_url,created_by').order('name').limit(1000);if(error){message('Erro ao carregar biblioteca: '+error.message,'err');return}exercises=data||[];draw()};
 const draw=()=>{const q=panel.querySelector('#exSearch').value.trim().toLocaleLowerCase('pt-BR'),m=panel.querySelector('#exMuscle').value.trim().toLocaleLowerCase('pt-BR'),e=panel.querySelector('#exEquipment').value.trim().toLocaleLowerCase('pt-BR'),env=panel.querySelector('#exEnvironment').value;const items=exercises.filter(x=>(x.name||'').toLocaleLowerCase('pt-BR').includes(q)&&(x.muscle_groups||[]).join(' ').toLocaleLowerCase('pt-BR').includes(m)&&(x.equipment||[]).join(' ').toLocaleLowerCase('pt-BR').includes(e)&&(!env||(x.environments||[]).includes(env)));panel.querySelector('#libraryResults').innerHTML=items.length?items.map(x=>`<div class="slot"><div><b>${esc(x.name)}</b><div class="muted small">${esc((x.muscle_groups||[]).join(', ')||'Sem grupo muscular')} · ${esc((x.equipment||[]).join(', ')||'Sem equipamento')} · ${esc((x.environments||[]).join(', ')||'Ambiente não definido')}</div>${x.description?`<p class="small">${esc(x.description)}</p>`:''}</div><button class="secondary" data-edit-ex="${esc(x.id)}">Editar</button></div>`).join(''):'<p class="muted">Nenhum exercício encontrado. Você pode cadastrar o primeiro!</p>';panel.querySelectorAll('[data-edit-ex]').forEach(b=>b.onclick=()=>editor(exercises.find(x=>x.id===b.dataset.editEx)))};
 const split=s=>String(s||'').split(',').map(x=>x.trim().toLocaleLowerCase('pt-BR')).filter(Boolean);
 const editor=(x=null)=>{const root=panel.querySelector('#libraryEditor');root.innerHTML=`<section class="card"><h2>${x?'Editar exercício':'Novo exercício'}</h2><form id="exerciseForm"><label>Nome *</label><input name="name" required maxlength="150" value="${esc(x?.name||'')}"><label>Descrição</label><textarea name="description" rows="2">${esc(x?.description||'')}</textarea><div class="grid"><div><label>Grupos musculares (separados por vírgula)</label><input name="muscles" placeholder="Pernas, glúteos" value="${esc((x?.muscle_groups||[]).join(', '))}"></div><div><label>Equipamentos (separados por vírgula)</label><input name="equipment" placeholder="Halter, colchonete" value="${esc((x?.equipment||[]).join(', '))}"></div></div><label>Ambientes</label><div class="row">${[['academia','Academia'],['estudio','Estúdio'],['casa','Casa']].map(([v,t])=>`<label style="margin:0"><input type="checkbox" name="env" value="${v}" style="width:auto" ${(x?.environments||[]).includes(v)?'checked':''}> ${t}</label>`).join('')}</div><label>Instruções de execução</label><textarea name="instructions" rows="4">${esc(x?.instructions||'')}</textarea><label>Link de vídeo ou imagem (opcional)</label><input name="media_url" type="url" placeholder="https://..." value="${esc(x?.media_url||'')}"><div class="row" style="margin-top:18px"><button type="submit">Salvar exercício</button><button type="button" class="secondary" id="cancelExercise">Cancelar</button>${x?'<button type="button" class="secondary" id="deleteExercise">Excluir</button>':''}</div></form><div id="exerciseFeedback"></div></section>`;root.scrollIntoView({behavior:'smooth',block:'start'});root.querySelector('#cancelExercise').onclick=()=>root.innerHTML='';root.querySelector('#exerciseForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget),name=String(f.get('name')||'').trim();if(!name)return;const patch={name,description:String(f.get('description')||'').trim()||null,muscle_groups:split(f.get('muscles')),equipment:split(f.get('equipment')),environments:f.getAll('env'),instructions:String(f.get('instructions')||'').trim()||null,media_url:String(f.get('media_url')||'').trim()||null,updated_at:new Date().toISOString()};const result=x?await sb.from('exercise_library').update(patch).eq('id',x.id).eq('created_by',user.id):await sb.from('exercise_library').insert({...patch,created_by:user.id});if(result.error){root.querySelector('#exerciseFeedback').innerHTML=msg(result.error.message,'err');return}root.innerHTML='';message('Exercício salvo com sucesso!','ok');await read()};if(x)root.querySelector('#deleteExercise').onclick=async()=>{if(!confirm('Excluir este exercício da biblioteca?'))return;const {error}=await sb.from('exercise_library').delete().eq('id',x.id).eq('created_by',user.id);if(error){root.querySelector('#exerciseFeedback').innerHTML=msg(error.message,'err');return}root.innerHTML='';message('Exercício excluído.','ok');await read()}};
 ['#exSearch','#exMuscle','#exEquipment','#exEnvironment'].forEach(id=>panel.querySelector(id).addEventListener('input',draw));panel.querySelector('#newExercise').onclick=()=>editor();await read();
 }
async function renderSchedule(panel,isTeacher){
 if(isTeacher&&weekOffset===0){const generated=await sb.rpc('ensure_class_slots');if(generated.error)console.warn('Horários não gerados:',generated.error.message)}
 const now=new Date(),base=new Date(now);base.setHours(0,0,0,0);base.setDate(base.getDate()-((base.getDay()+6)%7)+7*weekOffset);
 const finish=new Date(base);finish.setDate(base.getDate()+7);
 const {data:slots,error}=await sb.from('class_slots').select('id,starts_at,ends_at,capacity,active').eq('active',true).gte('starts_at',base.toISOString()).lt('starts_at',finish.toISOString()).order('starts_at').limit(200);
 if(error){panel.innerHTML=`<section class="card">${msg('Erro ao carregar horários: '+error.message,'err')}</section>`;return}
 const ids=(slots||[]).map(s=>s.id);let bookings=[],counts={};
 if(ids.length){
  const cr=await sb.rpc('slot_booking_counts',{p_slot_ids:ids});
  if(cr.error){panel.innerHTML=`<section class="card">${msg('Erro ao consultar vagas: '+cr.error.message,'err')}</section>`;return}
  counts=Object.fromEntries((cr.data||[]).map(c=>[c.slot_id,c.occupied]));
  const query=isTeacher
   ?sb.from('bookings').select('id,slot_id,status,student_id,cancelled_at,cancelled_by,profiles:student_id(full_name,age,whatsapp)').in('slot_id',ids)
   :sb.from('bookings').select('id,slot_id,status,student_id,cancelled_at').in('slot_id',ids).eq('student_id',user.id);
  const res=await query;
  if(res.error){panel.innerHTML=`<section class="card">${msg('Erro ao carregar reservas: '+res.error.message,'err')}</section>`;return}
  bookings=res.data||[];
 }
 const days=Array.from({length:6},(_,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);return d});
 const chosen=days[selectedDay]||days[0];
 const key=d=>d.toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
 const chosenSlots=(slots||[]).filter(s=>key(new Date(s.starts_at))===key(chosen));
 const hour=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
 const cancellationLimit=s=>new Date(s.starts_at).getTime()-60*60*1000;
 panel.innerHTML=`<section class="card"><h2>${isTeacher?'Agenda do professor':'Agendar horário'}</h2>
 <p class="muted">Cada turma comporta até quatro alunos. Alunos podem cancelar até uma hora antes da aula; professores podem cancelar a qualquer momento.</p>
 <div class="row space"><button class="secondary" id="prevWeek" ${weekOffset<=0?'disabled':''}>← Semana anterior</button><b>${base.toLocaleDateString('pt-BR')} a ${days[5].toLocaleDateString('pt-BR')}</b><button class="secondary" id="nextWeek" ${weekOffset>=4?'disabled':''}>Próxima semana →</button></div>
 <div class="days" style="margin-top:16px">${days.map((d,i)=>`<button data-day="${i}" class="${i===selectedDay?'selected':''}">${['Seg','Ter','Qua','Qui','Sex','Sáb'][i]}<br>${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</button>`).join('')}</div>
 <h3>Horários de ${chosen.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</h3>
 ${chosenSlots.length?chosenSlots.map(s=>{
  const all=bookings.filter(b=>b.slot_id===s.id),active=all.filter(b=>['confirmed','present'].includes(b.status));
  const mine=active.find(b=>b.student_id===user.id),occupied=counts[s.id]??active.length;
  const past=new Date(s.starts_at)<=new Date(),canCancel=Date.now()<=cancellationLimit(s);
  const cancelled=all.filter(b=>b.status==='cancelled');
  const teacherDetails=isTeacher?`<div class="mini" style="margin-top:6px">${active.length?active.map(b=>`<div class="row" style="margin:5px 0"><span>${esc(b.profiles?.full_name||'Aluno')} (${esc(b.status)})</span>${b.status==='confirmed'?`<button class="secondary" data-cancel="${b.id}" data-student-name="${esc(b.profiles?.full_name||'Aluno')}">Cancelar reserva</button>`:''}</div>`).join(''):'Nenhum aluno confirmado.'}${cancelled.length?`<details><summary>${cancelled.length} cancelamento(s) registrado(s)</summary>${cancelled.map(b=>`<div>${esc(b.profiles?.full_name||'Aluno')} — ${b.cancelled_at?new Date(b.cancelled_at).toLocaleString('pt-BR'):'data não registrada'}</div>`).join('')}</details>`:''}</div>`:'';
  const studentActions=mine
   ?(canCancel&&mine.status==='confirmed'?`<button class="secondary" data-cancel="${mine.id}">Cancelar reserva</button>`:`<span class="muted small">${mine.status==='present'?'Presença registrada':canCancel?'Reservado — cancelamento indisponível':'Reservado — prazo de cancelamento encerrado'}</span>`)
   :`<button data-book="${s.id}" ${past||occupied>=s.capacity?'disabled':''}>${past?'Encerrado':occupied>=s.capacity?'Lotado':'Reservar'}</button>`;
  return `<div class="slot"><div style="flex:1;min-width:0"><b>${hour(s.starts_at)}</b><div class="muted small">${occupied}/${s.capacity} vagas ocupadas</div>${teacherDetails}</div>${isTeacher?'':studentActions}</div>`;
 }).join(''):'<p class="muted">Nenhum horário disponível neste dia.</p>'}
 <div id="bookMessage" aria-live="polite"></div></section>`;
 panel.querySelector('#prevWeek').onclick=()=>{weekOffset--;renderSchedule(panel,isTeacher)};
 panel.querySelector('#nextWeek').onclick=()=>{weekOffset++;renderSchedule(panel,isTeacher)};
 panel.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDay=Number(b.dataset.day);renderSchedule(panel,isTeacher)});
 panel.querySelectorAll('[data-book]').forEach(b=>b.onclick=async()=>{
  b.disabled=true;const {error}=await sb.rpc('book_class_slot',{p_slot_id:b.dataset.book});
  if(error){panel.querySelector('#bookMessage').innerHTML=msg('Não foi possível reservar: '+error.message,'err');b.disabled=false}
  else await renderSchedule(panel,isTeacher);
 });
 panel.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{
  const who=isTeacher?` de ${b.dataset.studentName||'este aluno'}`:'';
  if(!confirm(`Deseja cancelar a reserva${who}? A vaga será liberada.`))return;
  b.disabled=true;
  const {error}=await sb.rpc('cancel_class_booking',{p_booking_id:b.dataset.cancel});
  if(error){const feedback=panel.querySelector('#bookMessage');if(feedback)feedback.innerHTML=msg('Não foi possível cancelar: '+error.message,'err');b.disabled=false;return}
  await renderSchedule(panel,isTeacher);
 });
}

async function renderCustomize(panel){const {data,error}=await sb.from('app_settings').select('*').eq('id',1).maybeSingle();if(error){panel.innerHTML=msg('Configuração indisponível: '+error.message,'err');return}const s=data||siteSettings;panel.innerHTML=`<section class="card"><h2>Identidade visual</h2><p class="muted">Alterações aparecerão para todos os usuários após atualizar a página.</p><form id="settingsForm"><label>Nome do aplicativo</label><input name="name" required maxlength="100" value="${esc(s.name)}"><label>Cor principal</label><input type="color" name="primary_color" value="${esc(s.primary_color||'#f97316')}" style="height:54px"><label>Logo (JPG, PNG ou WebP, até 2 MB)</label><input type="file" name="logo" accept="image/jpeg,image/png,image/webp"><p class="muted small">${s.logo_url?'Uma logo já está cadastrada. Envie outra para substituí-la.':'Sem logo: o aplicativo usa o símbolo padrão.'}</p><button type="submit">Salvar identidade visual</button></form><div id="settingsMessage"></div></section>`;panel.querySelector('#settingsForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),name=String(fd.get('name')||'').trim(),color=String(fd.get('primary_color')||'');const file=fd.get('logo');let logo_url=s.logo_url||null;const feedback=panel.querySelector('#settingsMessage');if(!/^#[0-9a-f]{6}$/i.test(color)||!name){feedback.innerHTML=msg('Confira o nome e a cor.','err');return}if(file?.size){if(file.size>2*1024*1024||!/^image\/(jpeg|png|webp)$/.test(file.type)){feedback.innerHTML=msg('Use JPG, PNG ou WebP com até 2 MB.','err');return}const ext=file.type.split('/')[1].replace('jpeg','jpg'),path=`logo-${Date.now()}.${ext}`;const upload=await sb.storage.from('branding').upload(path,file,{contentType:file.type});if(upload.error){feedback.innerHTML=msg('Erro na logo: '+upload.error.message,'err');return}logo_url=sb.storage.from('branding').getPublicUrl(path).data.publicUrl}const result=await sb.from('app_settings').update({name,primary_color:color,logo_url,updated_at:new Date().toISOString()}).eq('id',1);if(result.error){feedback.innerHTML=msg(result.error.message,'err');return}await loadSettings();feedback.innerHTML=msg('Identidade visual salva.','ok')}}
async function renderWorkouts(panel,isTeacher){if(!isTeacher){const {data,error}=await sb.from('workout_plans').select('id,title,notes,active,workout_exercises(id,name,sets,reps,instructions,sort_order)').eq('student_id',user.id).eq('active',true).order('created_at',{ascending:false});panel.innerHTML=`<section class="card"><h2>Meu treino</h2>${error?msg(error.message,'err'):(data||[]).map(p=>`<div class="exercise-row"><h3>${esc(p.title)}</h3><p>${esc(p.notes||'')}</p>${(p.workout_exercises||[]).sort((a,b)=>a.sort_order-b.sort_order).map(x=>`<div class="slot"><div><b>${esc(x.name)}</b><div class="muted small">${esc(x.sets||'—')} séries · ${esc(x.reps||'—')} repetições</div><p class="small">${esc(x.instructions||'')}</p></div></div>`).join('')}</div>`).join('')||'<p class="muted">Seu professor ainda não cadastrou um treino.</p>'}</section>`;return}const [{data:students,error:se},{data:library,error:le}]=await Promise.all([sb.from('profiles').select('id,full_name').eq('role','student').order('full_name'),sb.from('exercise_library').select('id,name,instructions').order('name').limit(1000)]);if(se||le){panel.innerHTML=msg((se||le).message,'err');return}const list=students||[];if(!list.length){panel.innerHTML=msg('Cadastre um aluno antes de montar um treino.');return}const student=selectedStudent&&list.some(x=>x.id===selectedStudent)?selectedStudent:list[0].id;panel.innerHTML=`<section class="card"><h2>Montar treino</h2><label>Aluno</label><select id="workoutStudent">${list.map(x=>`<option value="${x.id}" ${x.id===student?'selected':''}>${esc(x.full_name||'Aluno')}</option>`).join('')}</select><div id="plansList"></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Novo plano</h3><form id="planForm"><label>Nome do plano</label><input name="title" placeholder="Ex.: Treino A — força" required><label>Observações</label><textarea name="notes" rows="2"></textarea><button type="submit">Criar plano</button></form><div id="planFeedback"></div></section>`;const select=panel.querySelector('#workoutStudent');const refresh=async()=>{selectedStudent=select.value;const {data,error}=await sb.from('workout_plans').select('id,title,notes,active,workout_exercises(id,name,sets,reps,instructions,sort_order)').eq('student_id',select.value).order('created_at',{ascending:false});const root=panel.querySelector('#plansList');if(error){root.innerHTML=msg(error.message,'err');return}root.innerHTML=(data||[]).map(p=>`<div class="exercise-row"><div class="row space"><h3>${esc(p.title)} ${p.active?'':'(inativo)'}</h3><button class="secondary" data-toggle="${p.id}" data-active="${p.active}">${p.active?'Desativar':'Ativar'}</button></div><p class="small">${esc(p.notes||'')}</p>${(p.workout_exercises||[]).sort((a,b)=>a.sort_order-b.sort_order).map(x=>`<div class="slot"><div><b>${esc(x.name)}</b><div class="muted small">${esc(x.sets||'—')} séries · ${esc(x.reps||'—')} repetições</div></div><button class="secondary" data-remove="${x.id}">Remover</button></div>`).join('')}<form data-add="${p.id}"><label>Adicionar exercício da biblioteca</label><select name="exercise_id" required><option value="">Selecione</option>${(library||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><div class="grid"><div><label>Séries</label><input name="sets" placeholder="3"></div><div><label>Repetições / duração</label><input name="reps" placeholder="12 ou 30 s"></div></div><label>Orientações específicas</label><textarea name="instructions" rows="2"></textarea><button type="submit">Adicionar ao plano</button></form></div>`).join('')||'<p class="muted">Este aluno ainda não tem planos.</p>';root.querySelectorAll('[data-add]').forEach(f=>f.onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(f),x=(library||[]).find(v=>v.id===fd.get('exercise_id'));if(!x)return;const {error}=await sb.from('workout_exercises').insert({plan_id:f.dataset.add,name:x.name,sets:String(fd.get('sets')||''),reps:String(fd.get('reps')||''),instructions:String(fd.get('instructions')||'')||x.instructions||null,sort_order:root.querySelectorAll('[data-remove]').length});if(error)alert(error.message);else await refresh()});root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('Remover exercício deste plano?'))return;const {error}=await sb.from('workout_exercises').delete().eq('id',b.dataset.remove);if(error)alert(error.message);else await refresh()});root.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('workout_plans').update({active:b.dataset.active!=='true'}).eq('id',b.dataset.toggle);if(error)alert(error.message);else await refresh()})};select.onchange=refresh;panel.querySelector('#planForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),{error}=await sb.from('workout_plans').insert({student_id:select.value,teacher_id:user.id,title:String(fd.get('title')).trim(),notes:String(fd.get('notes')||'')});if(error)panel.querySelector('#planFeedback').innerHTML=msg(error.message,'err');else{e.currentTarget.reset();await refresh()}};await refresh()}
async function renderDiary(panel,isTeacher){if(isTeacher){const {data:students,error}=await sb.from('profiles').select('id,full_name').eq('role','student').order('full_name');if(error){panel.innerHTML=msg(error.message,'err');return}panel.innerHTML=`<section class="card"><h2>Diário dos alunos</h2><label>Aluno</label><select id="diaryStudent">${(students||[]).map(s=>`<option value="${s.id}">${esc(s.full_name||'Aluno')}</option>`).join('')}</select><div id="diaryEntries"></div></section>`;const show=async()=>{const id=panel.querySelector('#diaryStudent').value;if(!id)return;const {data,error}=await sb.from('diary_entries').select('entry_date,note').eq('student_id',id).order('entry_date',{ascending:false}).limit(100);panel.querySelector('#diaryEntries').innerHTML=error?msg(error.message,'err'):(data||[]).map(e=>`<div class="slot"><div><b>${esc(e.entry_date)}</b><p>${esc(e.note)}</p></div></div>`).join('')||'<p class="muted">Sem registros.</p>'};panel.querySelector('#diaryStudent').onchange=show;await show();return}panel.innerHTML=`<section class="card"><h2>Meu diário</h2><p class="muted">Registre como foi seu treino. Seu professor poderá acompanhar.</p><form id="diaryForm"><label>Data</label><input name="date" type="date" required value="${new Date().toLocaleDateString('en-CA')}"><label>Como foi o treino?</label><textarea name="note" required rows="4" maxlength="3000"></textarea><button type="submit">Salvar registro</button></form><div id="diaryFeedback"></div><h3>Registros anteriores</h3><div id="diaryEntries"></div></section>`;const read=async()=>{const {data,error}=await sb.from('diary_entries').select('entry_date,note').eq('student_id',user.id).order('entry_date',{ascending:false}).limit(100);panel.querySelector('#diaryEntries').innerHTML=error?msg(error.message,'err'):(data||[]).map(e=>`<div class="slot"><div><b>${esc(e.entry_date)}</b><p>${esc(e.note)}</p></div></div>`).join('')||'<p class="muted">Nenhum registro ainda.</p>'};panel.querySelector('#diaryForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const {data:plans,error:pe}=await sb.from('workout_plans').select('teacher_id').eq('student_id',user.id).eq('active',true).limit(1);if(pe||!plans?.length){panel.querySelector('#diaryFeedback').innerHTML=msg('É necessário ter um plano ativo para vincular o diário a um professor.','err');return}const {error}=await sb.from('diary_entries').insert({student_id:user.id,teacher_id:plans[0].teacher_id,entry_date:fd.get('date'),note:String(fd.get('note')).trim()});panel.querySelector('#diaryFeedback').innerHTML=error?msg(error.message,'err'):msg('Registro salvo!','ok');if(!error){e.currentTarget.querySelector('textarea').value='';await read()}};await read()}

init();
})();
</script></body></html>
