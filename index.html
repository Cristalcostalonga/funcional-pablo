<body>
  <div id="app"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script>
  (() => {
    'use strict';
    const DATA_KEY = 'funcionalPabloLovableDemo_v1';
    const SESSION_KEY = 'funcionalPabloLovableSession_v1';
    const TIMES_WEEKDAY = ['07:00','08:00','09:00','10:00','17:00','18:00','19:00','20:00'];
    const TIMES_SATURDAY = ['07:00','08:00','09:00','10:00','11:00'];
    const QUOTES = [
      'Consistência vale mais do que perfeição. Faça o que está ao seu alcance hoje.',
      'Pequenos progressos, repetidos com frequência, constroem grandes resultados.',
      'Respeite seu ritmo, celebre a evolução e continue em movimento.',
      'Disciplina também é saber adaptar o treino ao seu corpo e à sua rotina.'
    ];
    const DEFAULT_WORKOUT = [
      {id:'ex1',icon:'⚡',title:'Aquecimento ativo',desc:'Prepare o corpo antes da parte principal.',sets:'3 séries',duration:'45 s de execução · 15 s de pausa'},
      {id:'ex2',icon:'🏃',title:'Circuito funcional',desc:'Siga a sequência definida pelo professor e mantenha atenção à técnica.',sets:'4 blocos',duration:'Foco em agilidade e controle'},
      {id:'ex3',icon:'🧘',title:'Mobilidade e alongamento',desc:'Finalize respeitando seus limites e a amplitude confortável.',sets:'Finalização',duration:'10 minutos'}
    ];
    let data = loadData();
    let session = loadSession();
    let view = 'home';
    let loginRole = 'student';
    let selectedWorkoutStudent = '';
    let selectedDiaryStudent = '';
    let scheduleDate = dateKey(new Date(Date.now() + 86400000));
    let teacherScheduleDate = dateKey(new Date());
    let slotSelected = '';
    let studentSearch = '';
    let toastTimer;

    function seedData(){return {teacherWhatsapp:'',teacherName:'Pablo Costtalonga',teacherAge:null,teacherPhoto:'',students:{},bookings:[],nextId:1};}
    function loadData(){try{const raw=localStorage.getItem(DATA_KEY);if(!raw)return seedData();const d=JSON.parse(raw);return {...seedData(),...d,students:d.students||{},bookings:Array.isArray(d.bookings)?d.bookings:[]};}catch(e){return seedData();}}
    function loadSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;}}
    function save(){try{localStorage.setItem(DATA_KEY,JSON.stringify(data));}catch(e){notify('Não foi possível salvar neste navegador. Verifique o espaço disponível.','error');}}
    function saveSession(){try{if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));else localStorage.removeItem(SESSION_KEY);}catch(e){}}
    function uid(){return String(Date.now())+Math.random().toString(36).slice(2,7);}
    function normalizePhone(value){let p=String(value||'').replace(/\D/g,'');if(p.length===10||p.length===11)p='55'+p;return p;}
    function phoneValid(value){const p=normalizePhone(value);return p.length>=12&&p.length<=13&&p.startsWith('55');}
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function dateKey(date){const d=new Date(date);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
    function parseDate(key){const [y,m,d]=String(key).split('-').map(Number);return new Date(y,m-1,d,12);}
    function dateLabel(key,opts={weekday:'long',day:'2-digit',month:'long'}){if(!key)return 'Data não definida';return parseDate(key).toLocaleDateString('pt-BR',opts);}
    function addDays(key,amount){const d=parseDate(key);d.setDate(d.getDate()+amount);return dateKey(d);}
    function weekDateKeys(anchor){const d=parseDate(anchor);const mondayOffset=(d.getDay()+6)%7;d.setDate(d.getDate()-mondayOffset);return Array.from({length:6},(_,i)=>dateKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i,12)));}
    function avatarMarkup(person,extraClass=''){const name=person?.name||'?';const photo=person?.photo||person?.profilePhoto||'';return `<div class="avatar photo-avatar ${extraClass}">${photo?`<img src="${esc(photo)}" alt="Foto de ${esc(name)}" />`:esc(initials(name))}</div>`;}
    function imageFileToDataUrl(file){return new Promise((resolve,reject)=>{if(!file||!file.size){reject(new Error('Selecione uma foto de perfil.'));return;}if(!String(file.type||'').startsWith('image/')){reject(new Error('O arquivo precisa ser uma imagem.'));return;}if(file.size>12*1024*1024){reject(new Error('A foto deve ter no máximo 12 MB.'));return;}const reader=new FileReader();reader.onerror=()=>reject(new Error('Não foi possível ler a foto.'));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error('Não foi possível processar a foto.'));image.onload=()=>{try{const max=640,ratio=Math.min(1,max/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82));}catch(err){reject(new Error('Não foi possível compactar a foto.'));}};image.src=String(reader.result);};reader.readAsDataURL(file);});}
    function todayKey(){return dateKey(new Date());}
    function currentStudent(){return session&&session.role==='student'?data.students[session.phone]||null:null;}
    function allStudents(){return Object.values(data.students).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));}
    function activeBookings(){return data.bookings.filter(b=>b.status!=='cancelled');}
    function bookingsAt(date,time){return activeBookings().filter(b=>b.date===date&&b.time===time);}
    function studentBookings(phone){return data.bookings.filter(b=>b.phone===phone&&b.status!=='cancelled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));}
    function dayTimes(date){return parseDate(date).getDay()===6?TIMES_SATURDAY:parseDate(date).getDay()===0?[]:TIMES_WEEKDAY;}
    function timePassed(date,time){if(date!==todayKey())return date<todayKey();const [h,m]=time.split(':').map(Number);const n=new Date();return h<n.getHours()||(h===n.getHours()&&m<=n.getMinutes());}
    function notify(message,type='success'){const el=document.getElementById('toast');el.textContent=message;el.className='toast '+(type==='error'?'error':type==='success'?'success':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),4200);}
    function waLink(phone,message){const p=normalizePhone(phone);if(!p)return null;return `https://wa.me/${p}?text=${encodeURIComponent(message)}`;}
    function openWhatsApp(phone,message){const link=waLink(phone,message);if(!link){notify('WhatsApp não cadastrado ou número inválido.','error');return false;}window.open(link,'_blank','noopener,noreferrer');return true;}
    function makeStudent(name,phone,age,photo,profileType='Aluno'){return {phone,name,age:Number(age),photo,profileType:profileType==='Atleta'?'Atleta':'Aluno',level:'Iniciante',joinedAt:todayKey(),workout:DEFAULT_WORKOUT.map(x=>({...x,id:uid()})),completedDates:[],diary:[]};}
    function initials(name){return (String(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('')||'?').toUpperCase();}
    function navLabel(v){return ({home:'Início',workout:'Meu treino',schedule:'Agendar horário',history:'Meu histórico',students:'Alunos',diary:'Diário dos alunos',workouts:'Editar treinos',profile:'Perfil',settings:'Configurações'})[v]||'Início';}

    function render(){
      const root=document.getElementById('app');
      if(session?.role==='student'){const profile=data.students[session.phone];if(!profile||!profile.photo||!Number(profile.age)){session=null;saveSession();}}
      if(session?.role==='teacher'&&(!data.teacherPhoto||!Number(data.teacherAge))){session=null;saveSession();}
      if(!session){root.innerHTML=renderLogin();bindEvents();return;}
      if(session.role==='student'&&!data.students[session.phone]){session=null;saveSession();render();return;}
      const role=session.role;
      const nav=role==='teacher'?
        [{v:'home',icon:'◈',label:'Visão geral'},{v:'students',icon:'♙',label:'Alunos'},{v:'schedule',icon:'▦',label:'Agenda semanal'},{v:'diary',icon:'▤',label:'Diário dos alunos'},{v:'workouts',icon:'⚡',label:'Treinos'},{v:'profile',icon:'◉',label:'Perfil do professor'},{v:'settings',icon:'⚙',label:'Configurações'}]:
        [{v:'home',icon:'◈',label:'Início'},{v:'workout',icon:'⚡',label:'Meu treino'},{v:'schedule',icon:'▦',label:'Agendar horário'},{v:'history',icon:'◷',label:'Meu histórico'},{v:'profile',icon:'◉',label:'Meu perfil'}];
      if(!nav.some(n=>n.v===view))view='home';
      const whoName=role==='teacher'?session.name:currentStudent().name;
      const whoProfile=role==='teacher'?{name:whoName,photo:data.teacherPhoto}:{...currentStudent()};
      root.innerHTML=`<div class="app">
        <header class="topbar"><div class="top-brand"><div class="brand-mark">⚡</div><div><div class="brand-name">Funcional</div><div class="brand-sub">Pablo Costtalonga</div></div></div>
          <div class="top-actions"><span class="role-pill">${role==='teacher'?'Professor':'Aluno'}</span><div class="whoami">${avatarMarkup(whoProfile)}<div><div class="who-name">${esc(whoName)}</div><div class="who-role">${role==='teacher'?'Painel do professor':'Área do aluno'}</div></div></div><button class="btn btn-ghost btn-sm" data-action="logout" title="Sair">Sair ↗</button></div>
        </header>
        <div class="app-body"><aside class="sidebar"><div class="nav-heading">${role==='teacher'?'Gestão':'Meu espaço'}</div>${nav.map(n=>`<button class="nav-btn ${view===n.v?'active':''}" data-action="navigate" data-view="${n.v}"><span class="nav-icon">${n.icon}</span>${n.label}</button>`).join('')}<div class="side-bottom">${role==='teacher'?'Gestão de alunos, treinos e presença.':'Treine no seu ritmo. O treino é definido pelo professor.'}<br><br>Protótipo de demonstração</div></aside><main class="main">${renderView()}</main></div>
      </div>`;
      bindEvents();
    }

    function renderLogin(){return `<div class="login-wrap"><section class="login-art"><div class="top-brand"><div class="brand-mark">⚡</div><div><div class="brand-name">Funcional</div><div class="brand-sub">Pablo Costtalonga</div></div></div><div><div class="eyebrow">Força • movimento • constância</div><h1>Seu treino.<br><span>Sua evolução.</span></h1><p>Um espaço para acompanhar seus exercícios, agendar aulas e manter tudo organizado — do treino à presença.</p></div><div class="login-foot">Movimento com propósito · Rio de Janeiro</div></section>
      <section class="login-panel"><div class="eyebrow">Bem-vindo(a)</div><h2>Acesse sua conta</h2><p class="intro">Entre para acompanhar sua rotina ou gerenciar as atividades da turma.</p><div class="role-picker"><button type="button" class="role-option ${loginRole==='student'?'active':''}" data-action="choose-role" data-role="student"><span>🏋️</span><strong>Sou aluno(a) / atleta</strong><small>Acessar meus treinos e agendamentos</small></button><button type="button" class="role-option ${loginRole==='teacher'?'active':''}" data-action="choose-role" data-role="teacher"><span>🗓️</span><strong>Sou professor(a)</strong><small>Gerenciar alunos, treinos e presença</small></button></div>
      <form id="loginForm" class="form-grid"><div class="field span-2"><label for="loginName">Nome completo</label><input id="loginName" name="name" autocomplete="name" placeholder="Digite seu nome completo" minlength="3" required /></div><div class="field"><label for="loginAge">Idade</label><input id="loginAge" name="age" type="number" min="1" max="120" inputmode="numeric" placeholder="Ex.: 24" /></div><div class="field"><label for="loginPhone">WhatsApp com DDD</label><input id="loginPhone" name="phone" inputmode="tel" autocomplete="tel" placeholder="Ex.: (21) 99999-9999" required /></div>${loginRole==='student'?`<div class="field span-2"><label for="loginProfileType">Perfil</label><select id="loginProfileType" name="profileType" required><option value="Aluno">Aluno(a)</option><option value="Atleta">Atleta</option></select></div>`:''}<div class="field span-2"><label for="loginPhoto">Foto de perfil</label><input id="loginPhoto" name="photo" type="file" accept="image/*" /><small class="muted">Obrigatória no primeiro acesso; nos próximos, envie outra apenas se quiser atualizar.</small></div><div class="span-2"><button class="btn btn-primary btn-block" type="submit">${loginRole==='teacher'?'Entrar no painel →':'Entrar como aluno/atleta →'}</button></div></form>
      <div class="prototype-note"><strong>Importante — versão demonstrativa:</strong> esta página é estática e pode ser hospedada no GitHub Pages. Os dados e fotos ficam somente neste navegador e não são compartilhados com outros alunos ou dispositivos. Nome e WhatsApp não comprovam identidade; a escolha de “Professor” não é uma proteção de acesso. Não use dados reais nem publique informações pessoais de alunos antes de integrar autenticação segura, banco de dados com permissões e notificações por backend.</div></section></div>`;}

    function renderView(){if(session.role==='teacher'){return ({home:renderTeacherHome,students:renderTeacherStudents,schedule:renderTeacherSchedule,diary:renderTeacherDiary,workouts:renderTeacherWorkouts,profile:renderTeacherProfile,settings:renderTeacherSettings}[view]||renderTeacherHome)();}return ({home:renderStudentHome,workout:renderStudentWorkout,schedule:renderStudentSchedule,history:renderStudentHistory,profile:renderStudentProfile}[view]||renderStudentHome)();}
    function heading(kicker,title,description,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;}
    function stat(label,value,foot,icon='✦'){return `<div class="stat-card"><span class="stat-icon">${icon}</span><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`;}
    function exerciseMarkup(item,editable=false){return `<article class="exercise-card"><div class="exercise-icon">${esc(item.icon||'⚡')}</div><div style="flex:1;min-width:0">${editable?`<div class="form-grid"><div class="field"><label>Nome do exercício</label><input name="title_${esc(item.id)}" value="${esc(item.title)}" required /></div><div class="field"><label>Ícone/emoji</label><input name="icon_${esc(item.id)}" value="${esc(item.icon||'⚡')}" maxlength="8" /></div><div class="field span-2"><label>Orientação</label><textarea name="desc_${esc(item.id)}" rows="2">${esc(item.desc)}</textarea></div><div class="field"><label>Séries/blocos</label><input name="sets_${esc(item.id)}" value="${esc(item.sets||'A combinar')}" /></div><div class="field"><label>Duração/pausa</label><input name="duration_${esc(item.id)}" value="${esc(item.duration||'A combinar')}" /></div></div>`:`<h3>${esc(item.title)}</h3><p>${esc(item.desc)}</p><div class="exercise-meta"><span class="tag orange">${esc(item.sets||'Conforme orientação')}</span><span class="tag">${esc(item.duration||'')}</span></div>`}</div>${editable?`<button type="button" class="btn btn-danger btn-sm" data-action="remove-exercise" data-id="${esc(item.id)}" title="Remover exercício">Remover</button>`:''}</article>`;}
    function renderStudentHome(){const s=currentStudent();const done=s.completedDates||[];const upcoming=studentBookings(s.phone).find(b=>b.date>=todayKey()&&b.status==='scheduled');const quote=QUOTES[(new Date().getDate()+s.name.length)%QUOTES.length];return `${heading('Área do aluno',`Olá, ${esc(s.name.split(' ')[0])}!`,'Aqui está seu espaço de treino. Seu plano é definido pelo professor.')}
      <section class="hero"><div><div class="eyebrow">Seu foco de hoje</div><h2>Um passo de cada vez.</h2><p>${quote}</p><div style="margin-top:18px"><button class="btn" style="background:#111;color:#fff" data-action="navigate" data-view="workout">Ver meu treino →</button></div></div><div class="hero-icon">⚡</div></section>
      <div class="stats-grid">${stat('Treinos concluídos',done.length,'Sessões registradas','⚡')}${stat('Nível atual',esc(s.level),'Acompanhado pelo professor','✦')}${stat('Exercícios do plano',(s.workout||[]).length,'No treino atribuído','▤')}${stat('Próxima aula',upcoming?esc(upcoming.time):'—',upcoming?dateLabel(upcoming.date,{weekday:'short',day:'2-digit',month:'short'}):'Nenhum horário reservado','◷')}</div>
      <div class="two-col"><section><div class="section-head"><div><h2>Seu treino atual</h2><p>Visualização somente leitura</p></div><button class="btn btn-secondary btn-sm" data-action="navigate" data-view="workout">Ver todos</button></div><div class="exercise-list">${(s.workout||[]).slice(0,3).map(x=>exerciseMarkup(x)).join('')||`<div class="empty">Seu professor ainda não atribuiu exercícios.</div>`}</div></section><section><div class="section-head"><div><h2>Próximo agendamento</h2><p>Organize a sua semana</p></div></div>${upcoming?`<div class="panel"><span class="tag orange">Confirmado no sistema</span><h3 style="margin:14px 0 5px">${dateLabel(upcoming.date)}</h3><p class="muted small">Horário: <strong style="color:#fff">${esc(upcoming.time)}</strong></p><button class="btn btn-primary btn-block" style="margin-top:13px" data-action="navigate" data-view="schedule">Ver agendamentos</button></div>`:`<div class="panel"><div class="empty"><div class="big">◷</div>Você ainda não tem uma próxima aula agendada.<br><button class="btn btn-primary" style="margin-top:13px" data-action="navigate" data-view="schedule">Agendar treino</button></div></div>`}<div class="notice info" style="margin-top:12px">🔒 Você pode consultar seu treino e registrar a conclusão, mas não pode alterar os exercícios atribuídos pelo professor.</div></section></div>`;}

    function renderStudentWorkout(){const s=currentStudent();const completed=(s.completedDates||[]).includes(todayKey());return `${heading('Plano individual','Meu treino','Os exercícios são configurados pelo professor. Esta tela é somente para consulta e registro de conclusão.',`<span class="tag orange">${esc(s.level)}</span>`)}<div class="panel" style="margin-bottom:17px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2 class="panel-title" style="margin-bottom:5px">Treino atribuído</h2><div class="muted small">${(s.workout||[]).length} exercícios · Atualizado pelo professor</div></div><span class="tag">${completed?'✅ Concluído hoje':'⚡ Em andamento'}</span></div></div><div class="exercise-list">${(s.workout||[]).map(x=>exerciseMarkup(x)).join('')||`<div class="empty">Nenhum exercício cadastrado. Peça ao professor para configurar seu plano.</div>`}</div><div class="panel" style="margin-top:18px"><h2 class="panel-title">Registro do treino de hoje</h2><p class="muted small">Marque a sessão como concluída ao terminar. Isso não altera o plano de exercícios.</p><button class="btn ${completed?'btn-secondary':'btn-primary'}" data-action="complete-workout" ${completed?'disabled':''}>${completed?'✓ Treino concluído hoje':'✓ Marcar treino como concluído'}</button></div>`;}

    function renderStudentSchedule(){const s=currentStudent();const times=dayTimes(scheduleDate);const myBookings=studentBookings(s.phone).filter(b=>b.date>=todayKey());return `${heading('Agenda','Agendar horário','Escolha uma data e um horário disponível. Cada turma comporta no máximo 4 alunos.')}
      <div class="two-col"><section class="panel"><h2 class="panel-title">1. Escolha o dia</h2><div class="field"><label for="scheduleDate">Data do treino</label><input id="scheduleDate" name="scheduleDate" type="date" min="${todayKey()}" value="${esc(scheduleDate)}" data-change="student-date" /></div><p class="muted small" style="margin:10px 0 18px">${dateLabel(scheduleDate)}</p><h2 class="panel-title">2. Horários disponíveis</h2>${times.length?`<div class="slot-grid">${times.map(t=>{const count=bookingsAt(scheduleDate,t).length;const full=count>=4;const past=timePassed(scheduleDate,t);return `<button type="button" class="slot ${slotSelected===t?'selected':''} ${full?'full':''} ${past?'past':''}" data-action="select-slot" data-time="${t}" ${full||past?'disabled':''}>${t}<small>${full?'Turma lotada':past?'Horário encerrado':`${4-count} vaga(s)`}</small></button>`;}).join('')}</div>`:`<div class="empty">Não há turma aos domingos. Escolha outro dia da semana.</div>`}<div class="notice info" style="margin-top:16px">O sistema bloqueia o quinto agendamento para a mesma data e horário. A vaga só é liberada quando um agendamento é cancelado.</div><button class="btn btn-primary btn-block" style="margin-top:15px" data-action="confirm-booking" ${!slotSelected||!times.includes(slotSelected)||timePassed(scheduleDate,slotSelected)||bookingsAt(scheduleDate,slotSelected).length>=4?'disabled':''}>Confirmar agendamento →</button></section>
      <section><div class="panel"><h2 class="panel-title">Meus próximos horários</h2>${myBookings.length?`<div class="booking-list">${myBookings.map(b=>`<div class="booking-card"><div><div class="booking-date">${dateLabel(b.date,{weekday:'long',day:'2-digit',month:'short'})} · ${esc(b.time)}</div><div class="booking-sub">${b.status==='scheduled'?'Agendado':b.status==='attended'?'Presença registrada':b.status==='absent'?'Falta registrada':b.status}</div></div><div class="booking-actions"><span class="tag ${b.status==='attended'?'green':b.status==='absent'?'red':'orange'}">${b.status==='scheduled'?'Reservado':b.status==='attended'?'Presente':b.status==='absent'?'Faltou':'Status'}</span>${b.status==='scheduled'&&b.date>=todayKey()?`<button class="btn btn-danger btn-sm" data-action="cancel-booking" data-id="${esc(b.id)}">Cancelar</button>`:''}</div></div>`).join('')}</div>`:`<div class="empty"><div class="big">▦</div>Seus agendamentos aparecerão aqui.</div>`}</div><div class="panel" style="margin-top:13px"><h2 class="panel-title">Confirmação pelo WhatsApp</h2><p class="muted small" style="line-height:1.6">Ao confirmar, o sistema registra a reserva e dispara o fluxo de notificação do professor responsável. Neste protótipo, sem a Edge Function conectada, o WhatsApp abre com o texto pronto e é necessário tocar em <strong style="color:#fff">Enviar</strong>.</p>${data.teacherWhatsapp?`<span class="tag green">Número do professor cadastrado</span>`:`<span class="tag">Aguardando cadastro do professor</span>`}</div></section></div>`;}

    function renderStudentHistory(){const s=currentStudent();const bookings=studentBookings(s.phone).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));const done=(s.completedDates||[]).slice().sort().reverse();return `${heading('Sua jornada','Meu histórico','Consulte seus treinos concluídos e o status dos agendamentos.')}
      <div class="stats-grid">${stat('Treinos concluídos',done.length,'No seu histórico','⚡')}${stat('Agendamentos',bookings.length,'Reservas não canceladas','▦')}${stat('Presenças',bookings.filter(b=>b.status==='attended').length,'Marcadas pelo professor','✓')}${stat('Faltas',bookings.filter(b=>b.status==='absent').length,'Registradas pelo professor','!')}</div>
      <div class="two-col"><section class="panel"><h2 class="panel-title">Treinos concluídos</h2>${done.length?`<div class="booking-list">${done.map(d=>`<div class="booking-card"><div><div class="booking-date">${dateLabel(d)}</div><div class="booking-sub">Treino marcado como concluído por você</div></div><span class="tag green">✓ Concluído</span></div>`).join('')}</div>`:`<div class="empty">Seus treinos concluídos aparecerão aqui.</div>`}</section><section class="panel"><h2 class="panel-title">Histórico de agenda</h2>${bookings.length?`<div class="booking-list">${bookings.map(b=>`<div class="booking-card"><div><div class="booking-date">${dateLabel(b.date,{weekday:'short',day:'2-digit',month:'short'})} · ${esc(b.time)}</div><div class="booking-sub">${b.status==='scheduled'?'Agendado':b.status==='attended'?'Presença registrada':b.status==='absent'?'Falta registrada':'Cancelado'}</div></div><span class="tag ${b.status==='attended'?'green':b.status==='absent'?'red':'orange'}">${b.status==='scheduled'?'Agendado':b.status==='attended'?'Presente':'Faltou'}</span></div>`).join('')}</div>`:`<div class="empty">Você ainda não tem agendamentos.</div>`}</section></div>`;}

    function renderStudentProfile(){const s=currentStudent();return `${heading('Seu cadastro','Meu perfil','Seu perfil identifica você nas reservas e na agenda do professor.')}<section class="profile-card"><div class="profile-large">${s.photo?`<img src="${esc(s.photo)}" alt="Foto de perfil de ${esc(s.name)}" />`:esc(initials(s.name))}</div><div><div class="eyebrow">${esc(s.profileType||'Aluno')}</div><h2>${esc(s.name)}</h2><p class="muted" style="margin:0">${esc(displayPhone(s.phone))}</p><div class="profile-meta"><span class="tag orange">${Number(s.age)} anos</span><span class="tag">${esc(s.level||'Iniciante')}</span></div></div></section><div class="notice info">A foto e a idade são obrigatórias para manter o perfil completo. Para alterar seus dados, entre novamente e envie uma foto atualizada no acesso.</div>`;}

    function renderTeacherProfile(){return `${heading('Cadastro profissional','Perfil do professor','Este perfil aparece no sistema para identificar quem acompanha a turma.',`<button class="btn btn-primary" data-action="navigate" data-view="settings">Editar dados</button>`)}<section class="profile-card"><div class="profile-large">${data.teacherPhoto?`<img src="${esc(data.teacherPhoto)}" alt="Foto de ${esc(data.teacherName)}" />`:esc(initials(data.teacherName))}</div><div><div class="eyebrow">Professor responsável</div><h2>${esc(data.teacherName||session.name)}</h2><p class="muted" style="margin:0">WhatsApp: ${esc(displayPhone(data.teacherWhatsapp||session.phone))}</p><div class="profile-meta"><span class="tag orange">${Number(data.teacherAge||0)} anos</span><span class="tag">Perfil profissional</span></div></div></section><div class="notice info">A foto de perfil e a idade são obrigatórias. No protótipo, a imagem fica salva no navegador atual; na versão publicada, armazene-a em um serviço de arquivos com acesso controlado.</div>`;}

    function renderTeacherHome(){const students=allStudents();const today=todayKey();const todays=data.bookings.filter(b=>b.date===today&&b.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time));const upcoming=data.bookings.filter(b=>b.date>=today&&b.status==='scheduled').length;const absences=data.bookings.filter(b=>b.status==='absent'&&b.date>=dateKey(new Date(Date.now()-7*86400000))).length;return `${heading('Painel de gestão','Visão geral','Acompanhe os alunos, organize as turmas e registre presença.',`<button class="btn btn-primary" data-action="navigate" data-view="students">+ Cadastrar aluno</button>`)}
      ${!data.teacherWhatsapp?`<div class="notice warn" style="margin-bottom:18px"><strong>Falta configurar o WhatsApp do professor.</strong> Cadastre o número em Configurações para preparar as confirmações dos agendamentos.</div>`:''}
      <div class="stats-grid">${stat('Alunos cadastrados',students.length,'Na base deste protótipo','♙')}${stat('Aulas hoje',todays.length,'Reservas para hoje','▦')}${stat('Próximos treinos',upcoming,'Agendamentos futuros','◷')}${stat('Faltas recentes',absences,'Últimos 7 dias','!')}</div>
      <div class="two-col"><section class="panel"><div class="section-head" style="margin-top:0"><div><h2>Agenda de hoje</h2><p>${dateLabel(today)}</p></div><button class="btn btn-secondary btn-sm" data-action="navigate" data-view="schedule">Abrir agenda</button></div>${todays.length?`<div class="booking-list">${todays.map(b=>bookingTeacherCard(b)).join('')}</div>`:`<div class="empty"><div class="big">▦</div>Nenhum agendamento cadastrado para hoje.</div>`}</section><section class="panel"><div class="section-head" style="margin-top:0"><div><h2>Alunos recentes</h2><p>Cadastros disponíveis neste navegador</p></div><button class="btn btn-secondary btn-sm" data-action="navigate" data-view="students">Ver todos</button></div>${students.length?`<div class="booking-list">${students.slice(-5).reverse().map(s=>`<div class="booking-card"><div class="person-cell">${avatarMarkup(s)}<div><div class="person-name">${esc(s.name)}</div><div class="person-phone">${esc(s.profileType||'Aluno')} · ${Number(s.age||0)} anos · ${esc(displayPhone(s.phone))}</div></div></div><button class="btn btn-secondary btn-sm" data-action="edit-student-workout" data-id="${esc(s.phone)}">Treino</button></div>`).join('')}`:`<div class="empty">Ainda não há alunos. Cadastre um aluno para começar.</div>`}</section></div>
      <div class="section-head"><div><h2>Acesso rápido</h2><p>Atalhos para as tarefas mais comuns</p></div></div><div class="three-col"><button class="panel" style="text-align:left;color:#fff" data-action="navigate" data-view="students"><div style="font-size:1.5rem;color:var(--orange)">♙</div><h3 style="margin:10px 0 5px">Gerenciar alunos</h3><p class="muted small">Cadastrar, consultar e abrir os planos individuais.</p></button><button class="panel" style="text-align:left;color:#fff" data-action="navigate" data-view="diary"><div style="font-size:1.5rem;color:var(--orange)">▤</div><h3 style="margin:10px 0 5px">Diário do aluno</h3><p class="muted small">Registrar evolução, observações e acompanhamento.</p></button><button class="panel" style="text-align:left;color:#fff" data-action="navigate" data-view="settings"><div style="font-size:1.5rem;color:var(--orange)">⚙</div><h3 style="margin:10px 0 5px">Configurar WhatsApp</h3><p class="muted small">Definir o número que recebe as confirmações.</p></button></div>`;}

    function displayPhone(phone){const p=String(phone||'').replace(/\D/g,'');if(p.startsWith('55')&&p.length>=12){const local=p.slice(2);return `+55 (${local.slice(0,2)}) ${local.length===11?local.slice(2,7):local.slice(2,6)}-${local.slice(local.length===11?7:6)}`;}return phone||'Sem número';}
    function bookingTeacherCard(b){const s=data.students[b.phone];const person=s||{name:b.name,phone:b.phone};const statusLabel=b.status==='scheduled'?'Agendado':b.status==='attended'?'Presente':b.status==='absent'?'Faltou':'Cancelado';return `<div class="booking-card"><div class="person-cell">${avatarMarkup(person)}<div><div class="person-name">${esc(person.name||b.name)} <span class="muted">· ${esc(b.time)}</span></div><div class="booking-sub">${esc(person.profileType||'Aluno')} · ${Number(person.age||0)} anos · ${esc(displayPhone(b.phone))}</div><div style="margin-top:7px"><span class="tag ${b.status==='attended'?'green':b.status==='absent'?'red':'orange'}">${statusLabel}</span></div></div></div><div class="booking-actions">${b.status==='scheduled'?`<button class="btn btn-success btn-sm" data-action="mark-attended" data-id="${esc(b.id)}">Presente</button><button class="btn btn-danger btn-sm" data-action="mark-absent-notify" data-id="${esc(b.id)}">Faltou · avisar</button>`:b.status==='absent'?`<button class="btn btn-secondary btn-sm" data-action="notify-absence" data-id="${esc(b.id)}">Reenviar aviso</button>`:''}</div></div>`;}

    function renderTeacherStudents(){const students=allStudents().filter(s=>s.name.toLowerCase().includes(studentSearch.toLowerCase())||s.phone.includes(studentSearch.replace(/\D/g,'')));return `${heading('Gestão de pessoas','Alunos','Cadastre alunos e acesse os treinos individuais, o histórico e o diário.',`<button class="btn btn-primary" data-action="open-modal" data-modal="add-student">+ Cadastrar aluno</button>`)}<div class="panel" style="margin-bottom:16px"><div class="field"><label for="studentSearch">Buscar aluno</label><input id="studentSearch" value="${esc(studentSearch)}" placeholder="Nome ou WhatsApp" data-change="student-search" /></div></div>${students.length?`<div class="student-grid">${students.map(s=>`<article class="student-card"><div class="student-card-top">${avatarMarkup(s)}<div style="min-width:0"><h3>${esc(s.name)}</h3><p>${esc(s.profileType||'Aluno')} · ${Number(s.age||0)} anos</p><p>${esc(displayPhone(s.phone))}</p><p style="margin-top:5px">${(s.workout||[]).length} exercícios · ${(s.completedDates||[]).length} treinos concluídos</p></div></div><div class="student-card-actions"><button class="btn btn-secondary btn-sm" data-action="edit-student-workout" data-id="${esc(s.phone)}">⚡ Editar treino</button><button class="btn btn-secondary btn-sm" data-action="open-student-diary" data-id="${esc(s.phone)}">▤ Diário</button><button class="btn btn-ghost btn-sm" data-action="open-student-schedule" data-id="${esc(s.phone)}">▦ Agenda</button></div></article>`).join('')}</div>`:`<div class="empty"><div class="big">♙</div>${studentSearch?'Nenhum aluno corresponde à busca.':'Ainda não há alunos cadastrados.'}<br><button class="btn btn-primary" style="margin-top:13px" data-action="open-modal" data-modal="add-student">Cadastrar primeiro aluno</button></div>`}`;}

    function renderTeacherSchedule(){const selectedBookings=data.bookings.filter(b=>b.date===teacherScheduleDate&&b.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time));const times=dayTimes(teacherScheduleDate);const week=weekDateKeys(teacherScheduleDate);const weekLabel=`${dateLabel(week[0],{day:'2-digit',month:'short'})} – ${dateLabel(week[5],{day:'2-digit',month:'short',year:'numeric'})}`;const daysMarkup=week.map(date=>{const dayBookings=activeBookings().filter(b=>b.date===date);const dayTimesList=dayTimes(date);return `<article class="week-day"><div class="week-day-head"><strong>${esc(dateLabel(date,{weekday:'long'}))}</strong><span>${esc(dateLabel(date,{day:'2-digit',month:'long'}))} · ${dayBookings.length} aluno(s)</span></div><div class="week-slot-list">${dayTimesList.map(time=>{const group=bookingsAt(date,time).slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));return `<div class="week-slot-card ${group.length>=4?'at-capacity':''}"><div class="week-slot-top"><strong>${time}</strong><span class="week-slot-count ${group.length>=4?'full':''}">${group.length}/4 alunos</span></div>${group.length?group.map(b=>{const person=data.students[b.phone]||{name:b.name,phone:b.phone};return `<div class="week-person">${avatarMarkup(person)}<div class="week-person-copy"><div class="week-person-name">${esc(person.name||b.name)}</div><div class="week-person-meta">${esc(person.profileType||'Aluno')} · ${Number(person.age||0)} anos<br>${b.status==='attended'?'Presente':b.status==='absent'?'Faltou':'Agendado'}</div></div></div>`;}).join(''):`<div class="week-empty">Sem reservas</div>`}</div>`;}).join('')||`<div class="empty">Sem horários neste dia.</div>`}</div></article>`;}).join('');return `${heading('Organização da turma','Agenda semanal','Veja a ocupação por dia e horário, com até quatro alunos por turma.',`<button class="btn btn-primary" data-action="navigate" data-view="settings">Configurar WhatsApp</button>`)}
      <div class="panel" style="margin-bottom:17px"><div class="form-grid"><div class="field"><label for="teacherScheduleDate">Ir para uma data</label><input id="teacherScheduleDate" type="date" value="${esc(teacherScheduleDate)}" data-change="teacher-date" /></div><div class="field"><label>Semana visualizada</label><div class="info-line"><strong>${esc(weekLabel)}</strong><br><span class="muted">${week.reduce((sum,d)=>sum+activeBookings().filter(b=>b.date===d).length,0)} reserva(s) de segunda a sábado</span></div></div></div><div class="week-nav" style="margin-top:13px"><button class="btn btn-secondary btn-sm" data-action="teacher-week-prev">← Semana anterior</button><button class="btn btn-secondary btn-sm" data-action="teacher-week-next">Próxima semana →</button><button class="btn btn-ghost btn-sm" data-action="teacher-week-today">Ir para esta semana</button></div></div>
      <div class="section-head"><div><h2>Calendário semanal de turmas</h2><p>Cada bloco mostra vagas ocupadas, foto, nome, idade e perfil do aluno/atleta. Role horizontalmente para ver todos os dias.</p></div></div><div class="week-calendar-wrap"><div class="week-calendar">${daysMarkup}</div></div>
      <div class="section-head"><div><h2>Detalhe do dia selecionado</h2><p>${esc(dateLabel(teacherScheduleDate))} · ${selectedBookings.length} agendamento(s), máximo de 4 por horário.</p></div></div><div class="slot-grid" style="margin-bottom:22px">${times.length?times.map(t=>{const count=bookingsAt(teacherScheduleDate,t).length;return `<div class="slot ${count>=4?'full':''}" style="cursor:default">${t}<small>${count}/4 alunos</small><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,count/4*100)}%"></div></div></div>`;}).join(''):`<div class="empty" style="grid-column:1/-1">Não há horários regulares aos domingos.</div>`}</div>
      <div class="section-head"><div><h2>Lista de agendamentos do dia</h2><p>Registre o comparecimento ou envie um aviso de falta.</p></div></div>${selectedBookings.length?`<div class="booking-list">${selectedBookings.map(b=>bookingTeacherCard(b)).join('')}</div>`:`<div class="empty">Nenhum aluno agendado nesta data.</div>`}`;}

    function renderTeacherDiary(){const students=allStudents();if(!selectedDiaryStudent&&students.length)selectedDiaryStudent=students[0].phone;const s=data.students[selectedDiaryStudent];return `${heading('Acompanhamento','Diário dos alunos','Registre observações de treino, evolução e pontos para acompanhar nas próximas aulas.')}
      ${students.length?`<div class="two-col"><section class="panel"><h2 class="panel-title">Novo registro</h2><form id="diaryForm" class="form-grid"><div class="field span-2"><label for="diaryStudent">Aluno</label><select id="diaryStudent" name="phone" required>${students.map(st=>`<option value="${esc(st.phone)}" ${st.phone===selectedDiaryStudent?'selected':''}>${esc(st.name)}</option>`).join('')}</select></div><div class="field span-2"><label for="diaryDate">Data do registro</label><input id="diaryDate" name="date" type="date" value="${todayKey()}" required /></div><div class="field span-2"><label for="diaryNote">Observação</label><textarea id="diaryNote" name="note" placeholder="Ex.: evolução de técnica, adaptação de exercício, percepção de esforço..." required minlength="3"></textarea></div><div class="span-2"><button class="btn btn-primary btn-block" type="submit">Salvar registro no diário</button></div></form><div class="notice info" style="margin-top:14px">Os registros deste protótipo são armazenados localmente e ficam visíveis no painel do professor neste navegador.</div></section><section class="panel"><h2 class="panel-title">Diário de ${esc(s?.name||'aluno')}</h2>${s?.diary?.length?`<div class="booking-list">${s.diary.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<article class="booking-card" style="align-items:flex-start"><div><div class="booking-date">${dateLabel(n.date,{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}</div><p class="muted small" style="white-space:pre-wrap;line-height:1.6;margin:8px 0 0">${esc(n.note)}</p></div><button class="btn btn-danger btn-sm" data-action="delete-diary" data-phone="${esc(s.phone)}" data-id="${esc(n.id)}">Excluir</button></article>`).join('')}</div>`:`<div class="empty">Ainda não há observações para este aluno.</div>`}</section></div>`:`<div class="empty"><div class="big">▤</div>Cadastre ou aguarde o cadastro de um aluno para começar o diário.</div>`}`;}

    function renderTeacherWorkouts(){const students=allStudents();if(!selectedWorkoutStudent&&students.length)selectedWorkoutStudent=students[0].phone;const s=data.students[selectedWorkoutStudent];return `${heading('Prescrição individual','Editar treinos','Somente o professor pode alterar os exercícios, instruções, séries e duração atribuídos a cada aluno.')}
      ${students.length?`<section class="panel" style="margin-bottom:16px"><div class="form-grid"><div class="field"><label for="workoutStudent">Selecione o aluno</label><select id="workoutStudent" data-change="workout-student">${students.map(st=>`<option value="${esc(st.phone)}" ${st.phone===selectedWorkoutStudent?'selected':''}>${esc(st.name)}</option>`).join('')}</select></div><div class="field"><label for="workoutLevel">Nível do aluno</label><select id="workoutLevel" data-change="student-level">${['Iniciante','Intermediário','Avançado','Atleta Profissional'].map(l=>`<option ${s?.level===l?'selected':''}>${l}</option>`).join('')}</select></div></div><p class="muted small" style="margin:12px 0 0">As mudanças ficam vinculadas ao cadastro deste aluno.</p></section><form id="workoutForm"><div class="exercise-list">${(s?.workout||[]).map(x=>exerciseMarkup(x,true)).join('')}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px"><button type="button" class="btn btn-secondary" data-action="add-exercise">+ Adicionar exercício</button><button type="submit" class="btn btn-primary">Salvar plano de treino</button></div></form>`:`<div class="empty"><div class="big">⚡</div>Cadastre um aluno para configurar um treino individual.</div>`}`;}

    function renderTeacherSettings(){return `${heading('Preferências','Configurações','Atualize os dados do professor e o número que recebe confirmações de horários.')}<div class="two-col"><section class="panel"><h2 class="panel-title">Perfil e WhatsApp</h2><div class="person-cell" style="margin-bottom:17px">${avatarMarkup({name:data.teacherName,photo:data.teacherPhoto},'')}<div><div class="person-name">${esc(data.teacherName||session.name)}</div><div class="person-phone">Foto de perfil ${data.teacherPhoto?'cadastrada':'obrigatória'} · ${Number(data.teacherAge||0)} anos</div></div></div><form id="settingsForm" class="form-grid"><div class="field span-2"><label for="teacherName">Nome do professor</label><input id="teacherName" name="teacherName" value="${esc(data.teacherName||session.name)}" required /></div><div class="field"><label for="teacherAge">Idade</label><input id="teacherAge" name="teacherAge" type="number" min="1" max="120" value="${esc(data.teacherAge||'')}" required /></div><div class="field"><label for="teacherWhatsapp">WhatsApp para avisos</label><input id="teacherWhatsapp" name="teacherWhatsapp" inputmode="tel" value="${esc(data.teacherWhatsapp||'')}" placeholder="5521999999999" required /><small class="muted">Código do país + DDD + número.</small></div><div class="field span-2"><label for="teacherPhoto">Atualizar foto de perfil</label><input id="teacherPhoto" name="teacherPhoto" type="file" accept="image/*" /><small class="muted">A foto atual será mantida se não enviar outra.</small></div><div class="span-2"><button class="btn btn-primary" type="submit">Salvar configurações</button></div></form><div class="notice warn" style="margin-top:17px">Neste HTML, o fallback abre o WhatsApp com a mensagem pronta e exige tocar em Enviar. O envio automático precisa ser ligado a uma Edge Function segura e à WhatsApp Business Platform.</div></section><section class="panel"><h2 class="panel-title">Estado do protótipo</h2><div class="booking-list"><div class="booking-card"><div><div class="booking-date">Capacidade por horário</div><div class="booking-sub">Máximo de 4 agendamentos ativos por data e hora.</div></div><span class="tag green">Ativo</span></div><div class="booking-card"><div><div class="booking-date">Perfis com foto e idade</div><div class="booking-sub">Foto e idade obrigatórias no acesso e no cadastro de aluno.</div></div><span class="tag green">Ativo</span></div><div class="booking-card"><div><div class="booking-date">Calendário semanal</div><div class="booking-sub">Mostra vagas, alunos/atletas e perfis com foto em cada horário.</div></div><span class="tag orange">Demonstração</span></div><div class="booking-card"><div><div class="booking-date">Armazenamento</div><div class="booking-sub">LocalStorage do navegador atual.</div></div><span class="tag">Local</span></div></div><div class="notice info" style="margin-top:15px">Para uso real: autenticação segura, regras RLS, bloqueio transacional de vagas e função de WhatsApp no backend. O HTML local não compartilha dados entre dispositivos.</div></section></div>`;}

    async function saveSettings(form){const fd=new FormData(form);const name=String(fd.get('teacherName')||'').trim();const raw=String(fd.get('teacherWhatsapp')||'').trim();const age=Number(fd.get('teacherAge'));const file=fd.get('teacherPhoto');if(name.length<3){notify('Informe o nome completo do professor.','error');return;}if(!Number.isInteger(age)||age<1||age>120){notify('Informe uma idade válida.','error');return;}if(!phoneValid(raw)){notify('WhatsApp do professor inválido. Informe código do país e DDD.','error');return;}let photo=data.teacherPhoto||'';if(file&&file.size){try{photo=await imageFileToDataUrl(file);}catch(err){notify(err.message||'Foto inválida.','error');return;}}if(!photo){notify('A foto de perfil do professor é obrigatória.','error');return;}data.teacherName=name;data.teacherAge=age;data.teacherPhoto=photo;data.teacherWhatsapp=normalizePhone(raw);session.name=name;session.phone=data.teacherWhatsapp;save();saveSession();render();notify('Perfil e configurações salvos.','success');}

    function bindEvents(){/* Events are delegated from the document. */}
    document.addEventListener('click', e=>{
      const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
      if(action==='choose-role'){loginRole=el.dataset.role;render();return;}
      if(action==='navigate'){view=el.dataset.view;render();return;}
      if(action==='teacher-week-prev'){teacherScheduleDate=addDays(teacherScheduleDate,-7);render();return;}
      if(action==='teacher-week-next'){teacherScheduleDate=addDays(teacherScheduleDate,7);render();return;}
      if(action==='teacher-week-today'){teacherScheduleDate=todayKey();render();return;}
      if(action==='logout'){session=null;saveSession();view='home';slotSelected='';render();return;}
      if(action==='select-slot'){slotSelected=el.dataset.time;render();return;}
      if(action==='confirm-booking'){confirmBooking();return;}
      if(action==='cancel-booking'){cancelBooking(el.dataset.id);return;}
      if(action==='complete-workout'){completeWorkout();return;}
      if(action==='open-modal'){showModal(el.dataset.modal);return;}
      if(action==='edit-student-workout'){selectedWorkoutStudent=el.dataset.id;view='workouts';render();return;}
      if(action==='open-student-diary'){selectedDiaryStudent=el.dataset.id;view='diary';render();return;}
      if(action==='open-student-schedule'){teacherScheduleDate=todayKey();view='schedule';render();return;}
      if(action==='add-exercise'){addExercise();return;}
      if(action==='remove-exercise'){removeExercise(el.dataset.id);return;}
      if(action==='mark-attended'){markAttendance(el.dataset.id,'attended');return;}
      if(action==='mark-absent-notify'){markAbsentAndNotify(el.dataset.id);return;}
      if(action==='notify-absence'){notifyAbsence(el.dataset.id);return;}
      if(action==='delete-diary'){deleteDiary(el.dataset.phone,el.dataset.id);return;}
    });
    document.addEventListener('change',e=>{
      const key=e.target.dataset.change;if(!key)return;
      if(key==='student-date'){scheduleDate=e.target.value||todayKey();slotSelected='';render();}
      if(key==='teacher-date'){teacherScheduleDate=e.target.value||todayKey();render();}
      if(key==='student-search'){studentSearch=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('studentSearch');if(el){el.focus();el.setSelectionRange(pos,pos);}}
      if(key==='workout-student'){selectedWorkoutStudent=e.target.value;render();}
      if(key==='student-level'){const s=data.students[selectedWorkoutStudent];if(s){s.level=e.target.value;save();notify('Nível atualizado.','success');}}
    });
    document.addEventListener('submit',e=>{
      if(e.target.id==='loginForm'){e.preventDefault();login(e.target).catch(err=>{console.error(err);notify('Não foi possível entrar. Confira os dados e a foto.','error');});}
      if(e.target.id==='addStudentForm'){e.preventDefault();createStudent(e.target).catch(err=>{console.error(err);notify('Não foi possível cadastrar o aluno.','error');});}
      if(e.target.id==='diaryForm'){e.preventDefault();saveDiary(e.target);}
      if(e.target.id==='workoutForm'){e.preventDefault();saveWorkout(e.target);}
      if(e.target.id==='settingsForm'){e.preventDefault();saveSettings(e.target).catch(err=>{console.error(err);notify('Não foi possível salvar as configurações.','error');});}
    });

    async function login(form){const fd=new FormData(form);const name=String(fd.get('name')||'').trim().replace(/\s+/g,' ');const rawPhone=String(fd.get('phone')||'');const phone=normalizePhone(rawPhone);const photoFile=fd.get('photo');const profileType=String(fd.get('profileType')||'Aluno');if(name.length<3){notify('Digite seu nome completo.','error');return;}if(!phoneValid(rawPhone)){notify('Informe um WhatsApp válido com DDD. Ex.: (21) 99999-9999.','error');return;}if(loginRole==='teacher'&&data.teacherWhatsapp&&phone!==normalizePhone(data.teacherWhatsapp)){notify('Este número não corresponde ao WhatsApp do professor configurado neste protótipo.','error');return;}const existingProfile=loginRole==='teacher'?(data.teacherPhoto&&Number(data.teacherAge)?{age:data.teacherAge,photo:data.teacherPhoto}:null):(data.students[phone]||null);const ageInput=String(fd.get('age')||'').trim();const age=ageInput?Number(ageInput):Number(existingProfile?.age||0);if(!Number.isInteger(age)||age<1||age>120){notify('Informe sua idade para concluir o cadastro.','error');return;}let photo=existingProfile?.photo||'';if(photoFile&&photoFile.size){try{photo=await imageFileToDataUrl(photoFile);}catch(err){notify(err.message||'Foto inválida.','error');return;}}if(!photo){notify('Envie uma foto de perfil para concluir o cadastro.','error');return;}
      if(loginRole==='teacher'){
        const teacherWasRegistered=Boolean(data.teacherPhoto&&Number(data.teacherAge));
        data.teacherName=teacherWasRegistered?(data.teacherName||name):name;data.teacherAge=age;data.teacherPhoto=photo;data.teacherWhatsapp=data.teacherWhatsapp||phone;
        session={role:'teacher',phone:normalizePhone(data.teacherWhatsapp||phone),name:data.teacherName};
      }else{
        const existing=data.students[phone];
        if(existing){existing.name=name;existing.age=age;existing.photo=photo;existing.profileType=profileType==='Atleta'?'Atleta':'Aluno';session={role:'student',phone,name};}
        else{data.students[phone]=makeStudent(name,phone,age,photo,profileType);session={role:'student',phone,name};}
      }
      save();saveSession();view='home';render();notify(loginRole==='teacher'?'Perfil do professor atualizado. Acesso liberado.':'Perfil atualizado. Bem-vindo(a)!','success');}
    function showModal(type){const root=document.getElementById('modalRoot');if(type!=='add-student')return;root.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="addStudentTitle"><div class="modal-head"><div><div class="eyebrow">Novo cadastro</div><h2 id="addStudentTitle">Cadastrar aluno/atleta</h2></div><button type="button" class="icon-btn" data-action="close-modal" aria-label="Fechar">✕</button></div><form id="addStudentForm" class="form-grid"><div class="field span-2"><label for="newStudentName">Nome completo</label><input id="newStudentName" name="name" required minlength="3" placeholder="Nome do aluno/atleta" /></div><div class="field"><label for="newStudentAge">Idade</label><input id="newStudentAge" name="age" type="number" min="1" max="120" required placeholder="Ex.: 24" /></div><div class="field"><label for="newStudentPhone">WhatsApp com DDD</label><input id="newStudentPhone" name="phone" required inputmode="tel" placeholder="(21) 99999-9999" /></div><div class="field span-2"><label for="newStudentType">Perfil</label><select id="newStudentType" name="profileType" required><option value="Aluno">Aluno(a)</option><option value="Atleta">Atleta</option></select></div><div class="field span-2"><label for="newStudentPhoto">Foto de perfil (obrigatória)</label><input id="newStudentPhoto" name="photo" type="file" accept="image/*" required /></div><div class="span-2"><button class="btn btn-primary btn-block" type="submit">Cadastrar perfil</button></div></form></section></div>`;}
    document.addEventListener('click',e=>{if(e.target.matches('.modal-backdrop')||e.target.closest('[data-action="close-modal"]')){document.getElementById('modalRoot').innerHTML='';}});
    async function createStudent(form){const fd=new FormData(form);const name=String(fd.get('name')||'').trim().replace(/\s+/g,' ');const raw=String(fd.get('phone')||'');const phone=normalizePhone(raw);const age=Number(fd.get('age'));const type=String(fd.get('profileType')||'Aluno');if(name.length<3){notify('Informe o nome completo.','error');return;}if(!phoneValid(raw)){notify('Informe um WhatsApp válido com DDD.','error');return;}if(!Number.isInteger(age)||age<1||age>120){notify('Informe uma idade válida.','error');return;}if(data.students[phone]){notify('Já existe um aluno com este WhatsApp.','error');return;}let photo='';try{photo=await imageFileToDataUrl(fd.get('photo'));}catch(err){notify(err.message||'Envie uma foto de perfil.','error');return;}data.students[phone]=makeStudent(name,phone,age,photo,type);save();document.getElementById('modalRoot').innerHTML='';notify('Perfil do aluno/atleta cadastrado.','success');render();}
    async function confirmBooking(){const s=currentStudent();if(!s||!scheduleDate||!slotSelected)return;if(scheduleDate<todayKey()||timePassed(scheduleDate,slotSelected)){notify('Escolha uma data e um horário futuros.','error');return;}if(bookingsAt(scheduleDate,slotSelected).length>=4){notify('Este horário acabou de lotar. Escolha outro horário.','error');slotSelected='';render();return;}if(data.bookings.some(b=>b.phone===s.phone&&b.date===scheduleDate&&b.time===slotSelected&&b.status!=='cancelled')){notify('Você já tem uma reserva para este horário.','error');return;}const teacherPhone=data.teacherWhatsapp||'';const b={id:uid(),phone:s.phone,name:s.name,studentAge:s.age,profileType:s.profileType||'Aluno',date:scheduleDate,time:slotSelected,status:'scheduled',teacherPhone,teacherName:data.teacherName||'Professor',createdAt:new Date().toISOString()};data.bookings.push(b);save();const msg=`Olá, ${b.teacherName}! ${b.profileType} ${s.name} (${Number(s.age)} anos) confirmou um treino para ${dateLabel(scheduleDate,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}, às ${slotSelected}. WhatsApp do aluno: ${displayPhone(s.phone)}.`;slotSelected='';view='schedule';render();
      // In the real Lovable app, define this adapter to call a secured backend/Edge Function.
      if(typeof window.FUNCIONAL_WHATSAPP_SENDER==='function'){
        try{await window.FUNCIONAL_WHATSAPP_SENDER({event:'booking_confirmed',booking:{...b},to:teacherPhone,message:msg});notify('Agendamento confirmado e solicitação de notificação enviada ao backend.','success');return;}
        catch(err){console.error('Falha na integração do WhatsApp:',err);notify('Agendamento salvo, mas a integração automática falhou. Abrindo alternativa manual.','error');}
      }
      if(teacherPhone){const opened=openWhatsApp(teacherPhone,msg);notify(opened?'Agendamento confirmado. O WhatsApp do professor abriu com a mensagem pronta; toque em Enviar.':'Agendamento salvo, mas confira o WhatsApp do professor.','success');}else{notify('Agendamento salvo. Cadastre o WhatsApp do professor nas Configurações para preparar o aviso.','error');}}
    function cancelBooking(id){const b=data.bookings.find(x=>x.id===id);if(!b||b.phone!==session.phone||b.status!=='scheduled')return;b.status='cancelled';save();slotSelected='';render();notify('Agendamento cancelado; a vaga foi liberada.','success');}
    function completeWorkout(){const s=currentStudent();if(!s)return;s.completedDates=s.completedDates||[];if(s.completedDates.includes(todayKey()))return;s.completedDates.push(todayKey());save();render();notify('Treino de hoje registrado como concluído!','success');}
    function markAttendance(id,status){const b=data.bookings.find(x=>x.id===id);if(!b)return;b.status=status; b.updatedAt=new Date().toISOString();save();render();notify(status==='attended'?'Presença registrada.':'Status atualizado.','success');}
    function markAbsentAndNotify(id){const b=data.bookings.find(x=>x.id===id);if(!b)return;const s=data.students[b.phone];b.status='absent';b.updatedAt=new Date().toISOString();save();render();const msg=`Olá, ${s?.name||b.name}! Sentimos sua falta no treino marcado para ${dateLabel(b.date,{weekday:'long',day:'2-digit',month:'long'})}, às ${b.time}. Está tudo bem? Quando puder, fale com o professor para organizarmos o próximo horário.`;const opened=openWhatsApp(b.phone,msg);notify(opened?'Falta registrada. O WhatsApp do aluno abriu com o aviso pronto; confirme o envio.':'Falta registrada, mas não foi possível abrir o WhatsApp.','success');}
    function notifyAbsence(id){const b=data.bookings.find(x=>x.id===id);if(!b)return;const s=data.students[b.phone];const msg=`Olá, ${s?.name||b.name}! Registramos sua falta no treino de ${dateLabel(b.date,{weekday:'long',day:'2-digit',month:'long'})}, às ${b.time}. Está tudo bem? Fale com o professor para combinar a próxima sessão.`;openWhatsApp(b.phone,msg);}
    function saveDiary(form){const fd=new FormData(form);const phone=String(fd.get('phone'));const s=data.students[phone];const date=String(fd.get('date')||todayKey());const note=String(fd.get('note')||'').trim();if(!s||note.length<3){notify('Selecione um aluno e escreva uma observação.','error');return;}s.diary=s.diary||[];s.diary.push({id:uid(),date,note,createdAt:new Date().toISOString()});selectedDiaryStudent=phone;save();render();notify('Registro salvo no diário.','success');}
    function deleteDiary(phone,id){const s=data.students[phone];if(!s)return;s.diary=(s.diary||[]).filter(x=>x.id!==id);save();render();notify('Registro removido.','success');}
    function addExercise(){const s=data.students[selectedWorkoutStudent];if(!s)return;s.workout=s.workout||[];s.workout.push({id:uid(),icon:'🏋️',title:'Novo exercício',desc:'Descreva a orientação do exercício.',sets:'3 séries',duration:'A definir'});save();render();}
    function removeExercise(id){const s=data.students[selectedWorkoutStudent];if(!s)return;s.workout=(s.workout||[]).filter(x=>x.id!==id);save();render();notify('Exercício removido do rascunho salvo localmente.','success');}
    function saveWorkout(form){const s=data.students[selectedWorkoutStudent];if(!s)return;const fd=new FormData(form);s.workout=(s.workout||[]).map(item=>({...item,title:String(fd.get('title_'+item.id)||'').trim(),icon:String(fd.get('icon_'+item.id)||'⚡').trim(),desc:String(fd.get('desc_'+item.id)||'').trim(),sets:String(fd.get('sets_'+item.id)||'').trim(),duration:String(fd.get('duration_'+item.id)||'').trim()}));if(s.workout.some(x=>!x.title)){notify('Cada exercício precisa ter um nome.','error');return;}save();render();notify('Plano de treino atualizado para '+s.name+'.','success');}

    // Small demo utility: change the selected diary student from the visible selector.
    document.addEventListener('change',e=>{if(e.target.id==='diaryStudent'){selectedDiaryStudent=e.target.value;render();}});

    render();
  })();
  </script>
