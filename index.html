<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Funcional | Pablo Costtalonga</title>
<style>
:root{--bg:#090909;--panel:#141414;--line:#2b2b2b;--text:#f5f5f5;--muted:#a3a3a3;--orange:#f97316;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;font-weight:750;background:var(--orange);color:#111}button.secondary{background:#242424;color:#eee;border:1px solid #393939}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;background:#0d0d0d;color:#fff;border:1px solid #363636;border-radius:10px;padding:12px}label{display:block;font-size:.82rem;color:#c7c7c7;font-weight:700;margin:12px 0 6px}.shell{max-width:1100px;margin:auto;padding:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.bolt{background:var(--orange);color:#111;border-radius:13px;padding:8px 13px;font-size:1.4rem}.muted{color:var(--muted)}.small{font-size:.88rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}.narrow{max-width:560px;margin:42px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#2a1a0c;color:#fed7aa;margin:12px 0}.ok{background:#102518;color:#bbf7d0}.err{background:#351313;color:#fecaca}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#292929;border:2px solid var(--orange)}h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.12;margin:.4em 0}h2{margin-top:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav button{background:#242424;color:#eee}nav button.active{background:var(--orange);color:#111}.slot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.slot:last-child{border-bottom:0}.footer{padding:22px 0;color:#777;font-size:.8rem}
</style>
</head><body><div class="shell"><header class="row space"><div class="brand"><span class="bolt">⚡</span><span>Funcional<br><span class="muted small">Pablo Costtalonga</span></span></div><div id="headerActions" class="row"></div></header><main id="app"><div class="card narrow"><h1>Seu treino. Sua evolução.</h1><p class="muted">Carregando o sistema…</p></div></main><footer class="footer">Seus dados são vinculados à sua conta. Use “Sair” em dispositivos compartilhados.</footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<script>
(()=>{'use strict';
const app=document.querySelector('#app'), actions=document.querySelector('#headerActions');let sb=null,user=null,profile=null,tab='inicio';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(text,kind='notice')=>`<div class="notice ${kind}">${esc(text)}</div>`;
const ready=()=>window.FUNCIONAL_CONFIG&&FUNCIONAL_CONFIG.SUPABASE_URL.startsWith('https://')&&!FUNCIONAL_CONFIG.SUPABASE_ANON_KEY.includes('COLE_AQUI');
function init(){if(!window.supabase){app.innerHTML=`<div class="card">Não foi possível carregar a biblioteca de autenticação. Verifique sua conexão e recarregue a página.</div>`;return}if(!ready()){app.innerHTML=`<section class="card narrow"><h1>Configuração necessária</h1><p>O site está pronto para conectar, mas ainda precisa dos dados públicos do projeto Supabase.</p><ol><li>Crie um projeto no Supabase.</li><li>Abra <b>Project Settings → API</b>.</li><li>Copie a Project URL e a chave pública anon/publishable para o arquivo <code>config.js</code>.</li><li>Execute o arquivo <code>supabase/schema.sql</code> no SQL Editor.</li></ol><p class="muted">Não coloque aqui uma chave service_role ou qualquer segredo administrativo.</p></section>`;return}sb=window.supabase.createClient(FUNCIONAL_CONFIG.SUPABASE_URL,FUNCIONAL_CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});sb.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(load,0)});sb.auth.getSession().then(({data})=>{user=data.session?.user||null;load()})}
async function load(){if(!user){profile=null;actions.innerHTML='';renderAuth();return}const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error){app.innerHTML=`<section class="card">${msg('Não foi possível carregar seu perfil: '+error.message,'err')}<button onclick="location.reload()">Tentar novamente</button></section>`;return}profile=data;actions.innerHTML=`<span class="muted small">${esc(profile?.full_name||user.email)}</span> <button class="secondary" id="logout">Sair</button>`;document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut()};if(!profile||!profile.full_name||!profile.age||!profile.photo_path){renderProfile(true);return}renderHome()}
function renderAuth(error=''){app.innerHTML=`<section class="card narrow"><p class="muted">ÁREA DO ALUNO E DO PROFESSOR</p><h1>Acesse sua conta</h1><p class="muted">Entre uma vez e sua sessão será mantida neste navegador. Seus dados pessoais não precisam ser preenchidos novamente a cada acesso.</p>${error?msg(error,'err'):''}<form id="login"><label>E-mail</label><input name="email" type="email" autocomplete="email" required><label>Senha</label><input name="password" type="password" autocomplete="current-password" minlength="8" required><p class="small muted">Ainda não tem conta? Preencha os campos e escolha “Criar conta”.</p><div class="row"><button type="submit">Entrar</button><button type="button" class="secondary" id="signup">Criar conta de aluno</button></div></form><p class="small muted">O cadastro público cria contas de aluno. O perfil de professor precisa ser autorizado pelo administrador para proteger a área de gestão.</p></section>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)renderAuth(error.message)};document.querySelector('#signup').onclick=async()=>{const f=new FormData(document.querySelector('#login'));const email=f.get('email'),password=f.get('password');if(!email||!password||password.length<8){renderAuth('Informe e-mail e senha com pelo menos 8 caracteres para criar a conta.');return}const {error}=await sb.auth.signUp({email,password});if(error)renderAuth(error.message);else app.innerHTML=`<section class="card narrow">${msg('Conta criada. Se a confirmação por e-mail estiver habilitada no Supabase, confirme seu endereço e depois entre.','ok')}<button onclick="location.reload()">Voltar ao login</button></section>`}}
function renderProfile(first=false){const isTeacher=profile?.role==='teacher';app.innerHTML=`<section class="card narrow"><h1>${first?'Complete seu cadastro':'Meu perfil'}</h1><p class="muted">${first?'Preencha estas informações apenas no primeiro acesso. Depois, elas ficam salvas na sua conta.':'Atualize seus dados. Sua conta continuará vinculada ao mesmo perfil.'}</p><form id="profileForm"><label>Nome completo</label><input name="full_name" autocomplete="name" value="${esc(profile?.full_name||'')}" required maxlength="100"><label>Idade</label><input name="age" type="number" min="1" max="120" step="1" value="${esc(profile?.age||'')}" required><label>WhatsApp com DDD</label><input name="whatsapp" type="tel" autocomplete="tel" placeholder="Ex.: 5521999999999" value="${esc(profile?.whatsapp||'')}" required><label>Foto de perfil ${profile?.photo_path?'(já cadastrada; envie outra se quiser trocar)':'(obrigatória)'}</label><input name="photo" type="file" accept="image/png,image/jpeg,image/webp" ${profile?.photo_path?'':'required'}><label>Perfil</label><input value="${isTeacher?'Professor':'Aluno/Atleta'}" disabled><p class="small muted">Aceitamos imagens JPG, PNG ou WebP de até 5 MB. A foto é armazenada no espaço privado do sistema.</p><button type="submit">Salvar perfil</button> <button type="button" class="secondary" id="cancelEdit">Voltar</button></form><div id="formMessage"></div></section>`;document.querySelector('#cancelEdit').onclick=()=>{if(profile?.full_name&&profile?.photo_path)renderHome()};document.querySelector('#profileForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,fd=new FormData(form),name=String(fd.get('full_name')).trim(),age=Number(fd.get('age')),whatsapp=String(fd.get('whatsapp')).trim(),file=fd.get('photo');const out=document.querySelector('#formMessage');if(!name||!Number.isInteger(age)||age<1||age>120||!whatsapp){out.innerHTML=msg('Confira nome, idade e WhatsApp.','err');return}let photoPath=profile?.photo_path||null;if(file&&file.size){if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>5*1024*1024){out.innerHTML=msg('A foto precisa ser JPG, PNG ou WebP de até 5 MB.','err');return}const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';photoPath=`${user.id}/avatar.${ext}`;const {error:uploadErr}=await sb.storage.from('profile-photos').upload(photoPath,file,{upsert:true,contentType:file.type});if(uploadErr){out.innerHTML=msg('Erro ao enviar foto: '+uploadErr.message,'err');return}}if(!photoPath){out.innerHTML=msg('Envie uma foto de perfil para continuar.','err');return}const patch={id:user.id,full_name:name,age,whatsapp,photo_path:photoPath,updated_at:new Date().toISOString()};const {error}=await sb.from('profiles').upsert(patch,{onConflict:'id'});if(error){out.innerHTML=msg('Não foi possível salvar: '+error.message,'err');return}await load()}}
async function photoUrl(path){if(!path)return null;const {data}=await sb.storage.from('profile-photos').createSignedUrl(path,1800);return data?.signedUrl||null}
async function renderHome(){const isTeacher=profile.role==='teacher';const purl=await photoUrl(profile.photo_path);app.innerHTML=`<section class="card"><div class="row"><img class="avatar" id="avatar" alt="Foto de perfil"><div><p class="muted small">${isTeacher?'PAINEL DO PROFESSOR':'ÁREA DO ALUNO'}</p><h1>Olá, ${esc(profile.full_name.split(' ')[0])}!</h1><p class="muted">Seu perfil está salvo. Você não precisa preencher seus dados novamente.</p></div></div></section><nav>${(isTeacher?[['inicio','Visão geral'],['perfil','Perfil do professor'],['alunos','Alunos'],['agenda','Agenda'],['treinos','Treinos']]:[['inicio','Início'],['perfil','Meu perfil'],['agenda','Agendar horário'],['treinos','Meu treino']]).map(([id,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</nav><div id="panel"></div>`;if(purl)document.querySelector('#avatar').src=purl;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderHome()});const panel=document.querySelector('#panel');if(tab==='perfil'){panel.innerHTML=`<section class="card"><div class="row"><img class="avatar" src="${purl||''}" alt="Foto"><div><h2>${esc(profile.full_name)}</h2><p class="muted">${profile.age} anos · ${esc(profile.whatsapp)}</p></div></div><button id="editProfile">Editar meu perfil</button></section>`;document.querySelector('#editProfile').onclick=()=>renderProfile(false)}else if(tab==='agenda'){await renderSchedule(panel,isTeacher)}else if(tab==='alunos'&&isTeacher){const {data,error}=await sb.from('profiles').select('id,full_name,age,whatsapp,role').eq('role','student').order('full_name');panel.innerHTML=`<section class="card"><h2>Alunos cadastrados</h2>${error?msg(error.message,'err'):(data||[]).map(s=>`<div class="slot"><div><b>${esc(s.full_name)}</b><div class="muted small">${s.age} anos · ${esc(s.whatsapp)}</div></div><span class="muted small">${s.role==='student'?'Aluno/Atleta':''}</span></div>`).join('')||'<p class="muted">Ainda não há alunos cadastrados.</p>'}</section>`}else if(tab==='treinos'){panel.innerHTML=`<section class="card"><h2>${isTeacher?'Gestão de treinos':'Meu treino'}</h2><p class="muted">A estrutura de treinos está preparada no banco de dados. A próxima etapa de configuração é criar os planos e exercícios pela área do professor.</p></section>`}else{panel.innerHTML=`<div class="grid"><section class="card"><h2>Seu perfil está salvo</h2><p class="muted">Nome, idade, WhatsApp e foto ficam vinculados à sua conta.</p><button class="secondary" id="goProfile">Ver perfil</button></section><section class="card"><h2>${isTeacher?'Gestão':'Agenda de aulas'}</h2><p class="muted">${isTeacher?'Consulte os alunos e acompanhe a agenda.':'Consulte os horários disponíveis e confirme sua reserva.'}</p><button id="goSchedule">${isTeacher?'Abrir agenda':'Ver horários'}</button></section></div>`;document.querySelector('#goProfile').onclick=()=>{tab='perfil';renderHome()};document.querySelector('#goSchedule').onclick=()=>{tab='agenda';renderHome()}}}
async function renderSchedule(panel,isTeacher){const {data:slots,error}=await sb.from('class_slots').select('id,starts_at,ends_at,capacity,active').eq('active',true).gte('starts_at',new Date().toISOString()).order('starts_at').limit(60);if(error){panel.innerHTML=`<section class="card">${msg('Não foi possível carregar a agenda. Confirme se o banco foi configurado: '+error.message,'err')}</section>`;return}let bookings=[];if(isTeacher){const {data}=await sb.from('bookings').select('id,slot_id,status,student_id,profiles:student_id(full_name,age,whatsapp)').in('slot_id',(slots||[]).map(s=>s.id).length?(slots||[]).map(s=>s.id):['00000000-0000-0000-0000-000000000000']);bookings=data||[]}else{const {data}=await sb.from('bookings').select('id,slot_id,status').eq('student_id',user.id);bookings=data||[]}panel.innerHTML=`<section class="card"><h2>${isTeacher?'Agenda disponível':'Horários disponíveis'}</h2><p class="muted">Cada horário comporta no máximo quatro reservas. A disponibilidade é validada no banco de dados.</p>${!slots?.length?'<p class="muted">Não há horários futuros cadastrados. O professor ou administrador precisa criar os horários.</p>':slots.map(s=>{const bs=bookings.filter(b=>b.slot_id===s.id&&b.status==='confirmed');const mine=bs.some(b=>b.student_id===user.id);return `<div class="slot"><div><b>${new Date(s.starts_at).toLocaleString('pt-BR',{dateStyle:'medium',timeStyle:'short'})}</b><div class="muted small">${bs.length}/${s.capacity} vagas ocupadas ${isTeacher&&bs.length?'<br>'+bs.map(b=>esc(b.profiles?.full_name||'Aluno')).join(', '):''}</div></div>${isTeacher?'<span class="muted small">Visão do professor</span>':`<button data-book="${s.id}" ${mine||bs.length>=s.capacity?'disabled':''}>${mine?'Reservado':bs.length>=s.capacity?'Lotado':'Reservar'}</button>`}</div>`}).join('')}<div id="bookMessage"></div></section>`;panel.querySelectorAll('[data-book]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await sb.rpc('book_class_slot',{p_slot_id:b.dataset.book});const m=panel.querySelector('#bookMessage');if(error)m.innerHTML=msg(error.message,'err');else m.innerHTML=msg('Reserva confirmada e salva no banco de dados. A notificação automática de WhatsApp ainda exige configurar uma integração oficial.','ok');await renderSchedule(panel,isTeacher)})}
init();
})();
</script></body></html>
